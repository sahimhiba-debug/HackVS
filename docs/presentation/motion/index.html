<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Club Pulse — Motion</title>
<style>
@font-face { font-family: PJS; src: url(../../../prototype/web/pulse/polices/plus-jakarta-sans-latin-wght-normal.woff2) format('woff2'); font-weight: 200 800; }
@font-face { font-family: PJS; src: url(../../../prototype/web/pulse/polices/plus-jakarta-sans-latin-ext-wght-normal.woff2) format('woff2'); font-weight: 200 800; unicode-range: U+0100-024F, U+1E00-1EFF, U+20A0-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: JBM; src: url(../../../prototype/web/pulse/polices/jetbrains-mono-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: JBM; src: url(../../../prototype/web/pulse/polices/jetbrains-mono-latin-500-normal.woff2) format('woff2'); font-weight: 500; }
:root { --rouge: #CD2128; --rouge2: #FF3B44; --encre: #141923; --nuit: #06080C; --blanc: #F5F3EF; --gris: #8A93A3; --vert: #16A34A; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
body { font-family: PJS, sans-serif; color: var(--blanc); -webkit-font-smoothing: antialiased; cursor: none; }
#scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--nuit); transform-origin: 0 0; }
.sc { position: absolute; inset: 0; display: none; }
.abs { position: absolute; }
.mono { font-family: JBM, monospace; }
.centre { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.titre { font-weight: 800; letter-spacing: -0.035em; line-height: 1.02; }
.w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 0.04em 0.12em; margin-bottom: -0.12em; }
.w > i { display: inline-block; font-style: normal; will-change: transform; }
#lueur { position: absolute; inset: -20%; pointer-events: none; }
#grain { position: absolute; inset: 0; pointer-events: none; opacity: .055; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
#hud { position: absolute; left: 64px; right: 64px; bottom: 44px; display: flex; justify-content: space-between; font-family: JBM, monospace; font-size: 15px; letter-spacing: .18em; text-transform: uppercase; color: rgba(245,243,239,.38); pointer-events: none; }
#hud b { color: var(--rouge2); font-weight: 500; }
.etiquette { font-family: JBM, monospace; font-size: 17px; letter-spacing: .16em; text-transform: uppercase; color: rgba(245,243,239,.55); }
.pastille { display: inline-flex; align-items: center; gap: 10px; font-family: JBM, monospace; font-size: 16px; letter-spacing: .14em; text-transform: uppercase; padding: 9px 16px; border-radius: 99px; background: rgba(22,163,74,.16); color: #4ADE80; border: 1px solid rgba(74,222,128,.35); }
.pastille::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #4ADE80; box-shadow: 0 0 12px #4ADE80; }
/* carte de visite */
.persp { position: absolute; inset: 0; perspective: 2200px; }
.carte { position: absolute; width: 760px; height: 492px; left: 50%; top: 50%; margin: -246px 0 0 -380px; border-radius: 12px; padding: 58px 62px;
  background: linear-gradient(140deg, #FBF7EF 0%, #F1EADD 55%, #E9E0CF 100%); color: var(--encre); transform-style: preserve-3d;
  box-shadow: 0 2px 0 rgba(255,255,255,.6) inset, 0 60px 120px rgba(0,0,0,.55), 0 18px 40px rgba(0,0,0,.35); }
.carte .nom { font-size: 58px; font-weight: 800; letter-spacing: -0.03em; margin-top: 26px; }
.carte .metier { font-size: 27px; font-weight: 500; color: #4B5563; margin-top: 8px; }
.carte .lieu { position: absolute; left: 62px; bottom: 56px; font-size: 21px; color: #6B7280; font-weight: 600; letter-spacing: .02em; }
.carte .barres { position: absolute; right: 62px; bottom: 58px; display: grid; gap: 14px; justify-items: end; }
.carte .barres i { display: block; height: 10px; border-radius: 6px; background: #D6CDBD; }
.carte .brin { position: absolute; right: 58px; top: 52px; }
.mini { position: absolute; width: 150px; height: 97px; border-radius: 5px; box-shadow: 0 6px 14px rgba(0,0,0,.45); padding: 14px; }
.mini i { display: block; height: 7px; border-radius: 4px; background: rgba(20,25,35,.18); margin-bottom: 8px; }
/* écrans réels */
.ecran { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; border-radius: 10px; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,.6); }
.ecran img { width: 1440px; height: 900px; display: block; }
.spot { position: absolute; border-radius: 16px; box-shadow: 0 0 0 3000px rgba(6,8,12,.82); border: 3px solid #fff; }
.tel { position: absolute; width: 440px; height: 916px; border-radius: 64px; background: #0B0D12; padding: 16px; box-shadow: 0 0 0 2px #2A2F3A, 0 50px 120px rgba(0,0,0,.6); }
.tel .vitre { width: 408px; height: 884px; border-radius: 50px; overflow: hidden; position: relative; background: #F1F2F4; }
.tel .vitre img { position: absolute; left: 0; top: 0; width: 408px; }
.fondu { transition: none; }
/* chiffres */
.chiffre b { display: block; font-family: JBM, monospace; font-weight: 500; font-size: 96px; letter-spacing: -0.04em; color: var(--blanc); line-height: 1; }
.chiffre b.gel { color: rgba(245,243,239,.28); font-size: 64px; letter-spacing: .02em; border-bottom: 2px dashed rgba(245,243,239,.22); padding-bottom: 10px; display: inline-block; }
.chiffre span { display: block; font-size: 22px; color: var(--gris); margin-top: 18px; line-height: 1.35; font-weight: 500; }
.bloc { position: absolute; width: 74px; height: 74px; border-radius: 12px; }
.point { position: absolute; width: 26px; height: 26px; border-radius: 50%; }
#aide { position: absolute; right: 30px; top: 30px; background: rgba(0,0,0,.8); color: #fff; font: 15px/1.6 JBM, monospace; padding: 18px 22px; border-radius: 12px; display: none; z-index: 9; }
video#film { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; display: none; object-fit: contain; }
</style>
</head>
<body>
<div id="scene">
  <div id="lueur"></div>
  <div id="couches"></div>
  <div id="grain"></div>
  <div id="vignette"></div>
  <div id="hud"><span>Club Pulse <b>·</b> Hack VS 2026</span><span id="hud-chap"></span></div>
</div>
<video id="film" src="film.mp4" preload="auto" playsinline></video>
<div id="aide">Espace / → / clic : suivant<br>← : revenir<br>1–8 : chapitre<br>D : démo de secours<br>F : plein écran · H : aide</div>
<script src="chiffres.js"></script>
<script>
"use strict";
// ============================================================ outils
const CAP = "../captures/";
const $ = (s, r = document) => r.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  out: p => 1 - Math.pow(1 - p, 3),
  expo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
  inout: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  back: p => { const c = 1.45; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); },
  in: p => p * p * p,
};
const tw = (t, a, b, ease = E.out) => ease(prog(t, a, b));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mots(texte) { return texte.split(" ").map(m => `<span class="w"><i>${m}</i></span>`).join(" "); }
// révèle les mots d'un élément : entrée à t0 (décalage par mot), sortie à t1
function texte(el, t, t0, t1 = 1e9, pas = 0.07, duree = 0.85) {
  const ws = el.querySelectorAll(".w > i");
  ws.forEach((w, k) => {
    const pin = E.expo(prog(t, t0 + k * pas, t0 + k * pas + duree));
    const pout = E.in(prog(t, t1 + k * pas * 0.5, t1 + k * pas * 0.5 + 0.5));
    w.style.transform = `translateY(${(1 - pin) * 112 - pout * 112}%)`;
    w.style.opacity = pin * (1 - pout);
  });
}
const vis = (el, o) => { el.style.opacity = o; el.style.visibility = o <= 0.001 ? "hidden" : "visible"; };
const anneau = (r, ep, coul, ouv = 0.25, rot = -90, extra = "") =>
  `<svg width="${2 * r + ep * 2}" height="${2 * r + ep * 2}" viewBox="${-r - ep} ${-r - ep} ${2 * r + 2 * ep} ${2 * r + 2 * ep}" ${extra}>
     <circle r="${r}" fill="none" stroke="${coul}" stroke-width="${ep}" stroke-linecap="round" data-anneau="${ouv}" transform="rotate(${rot})"
       stroke-dasharray="${2 * Math.PI * r * (1 - ouv)} ${2 * Math.PI * r * ouv}"/></svg>`;
function ouvrir(svg, ouv) { const c = svg.querySelector("circle"); const r = +c.getAttribute("r"); const L = 2 * Math.PI * r;
  c.setAttribute("stroke-dasharray", `${L * (1 - ouv)} ${Math.max(L * ouv, 0.001)}`); }
const LOGO = (taille, ouv = 11 / 44) => `<svg width="${taille}" height="${taille}" viewBox="0 0 24 24" class="logo"><rect x=".5" y=".5" width="23" height="23" rx="7" fill="#CD2128"/>
  <circle cx="12" cy="12" r="7" fill="none" stroke="#FFF" stroke-width="2.7" stroke-linecap="round" stroke-dasharray="${44 * (1 - ouv)} ${44 * ouv}" transform="rotate(-90 12 12)"/>
  <circle cx="7.05" cy="7.05" r="1.8" fill="#FFF"/></svg>`;

// ============================================================ chapitres (temps continu, en secondes)
// La version continue suit le minutage de 02_STRUCTURE (10:00) ; le lecteur de scène s'arrête aux repères.
const CH = [
  { id: 1, nom: "01 — La carte", t0: 0, t1: 45 },
  { id: 2, nom: "02 — Entre deux événements", t0: 45, t1: 120 },
  { id: 3, nom: "Le court métrage", t0: 120, t1: 265, film: true },
  { id: 4, nom: "03 — Le vrai produit", t0: 265, t1: 310 },
  { id: 5, nom: "04 — La démo · secours", t0: 310, t1: 430, demo: true },
  { id: 6, nom: "05 — Ce qui est prouvé", t0: 430, t1: 490 },
  { id: 7, nom: "06 — L'IA", t0: 490, t1: 550 },
  { id: 8, nom: "07 — Et après", t0: 550, t1: 610 },
];
const FIN = 610;
// repères du lecteur : [pause, reprise] — la version continue joue les attentes, le lecteur les saute au clic
const REPERES = [
  [8, 26], [34.5, 35], [44.9, 45],
  [58.5, 59], [86, 86], [96.5, 97], [119.9, 120],
  [271.5, 280], [284.5, 287], [306.5, 309.9], [309.95, 430],
  [314, 340], [344, 370], [373, 385], [388, 400], [405, 420], [429.9, 430],
  [435, 437], [446, 447], [459, 460], [467.5, 468], [489.9, 490],
  [500.5, 504], [517.5, 520], [536.5, 540], [549.9, 550],
  [558.5, 562], [568.5, 580], [585.5, 590], [599.9, 600], [609.9, 610],
];

const couches = $("#couches");
const SC = [];
function scene(t0, t1, html, maj, init) {
  const el = document.createElement("div"); el.className = "sc"; el.innerHTML = html; couches.appendChild(el);
  const s = { t0, t1, el, maj }; if (init) init(el); SC.push(s); return s;
}

// ------------------------------------------------------------ 1. LA CARTE (0–45)
const brin = `<svg class="brin" width="70" height="90" viewBox="0 0 70 90"><path d="M35 88 C35 60 36 35 40 6" stroke="#5B7F55" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M37 52 C22 48 12 36 11 22 C25 25 35 36 37 52Z" fill="#7FA273"/><path d="M38 38 C52 33 60 22 60 9 C47 13 39 24 38 38Z" fill="#6E9564"/>
  <path d="M36 68 C50 66 60 57 63 45 C49 47 39 56 36 68Z" fill="#8DB081"/></svg>`;
const CARTE = `<div class="carte">${brin}<div class="mono" style="font-size:15px;letter-spacing:.2em;color:#9A8F7A">CARTE DE VISITE</div>
  <div class="nom">Sophie</div><div class="metier">Tisanes de plantes alpines</div><div class="lieu">Orsières · Valais</div>
  <div class="barres"><i style="width:230px"></i><i style="width:180px"></i></div></div>`;
{
  const R = rng(7); const minis = [];
  const coul = ["#F7F2E8", "#E6ECF5", "#F4E4E4", "#E7F0E2", "#F3EED9", "#ECE7F3", "#FFFFFF"];
  let mh = ""; for (let k = 0; k < 46; k++) {
    const m = { x: 760 + R() * 400 - 75, y: 850 - Math.floor(k / 6) * 14 - R() * 10, r: (R() - .5) * 50, d: 26 + k * 0.105, c: coul[k % coul.length] };
    minis.push(m); mh += `<div class="mini" style="background:${m.c}"><i style="width:70%"></i><i style="width:45%"></i></div>`; }
  scene(0, 45, `
    <div class="persp">${CARTE}</div>
    <div class="abs titre q" style="left:1100px;top:400px;font-size:116px;width:760px;color:var(--blanc)">${mots("« On")} ${mots("s'appelle. »")}</div>
    <div class="abs mono fictif" style="left:64px;top:52px;font-size:15px;letter-spacing:.2em;color:rgba(245,243,239,.4)">PERSONNAGE FICTIF</div>
    <svg class="abs boite" width="1920" height="1080" style="left:0;top:0"><g fill="none" stroke="rgba(245,243,239,.75)" stroke-width="3" stroke-linejoin="round">
      <path class="b1" d="M640 760 L1280 760 L1280 990 L640 990 Z"/><path class="b2" d="M640 760 L720 690 L1360 690 L1280 760 M1280 990 L1360 920 L1360 690"/></g></svg>
    <div class="minis">${mh}</div>
    <div class="centre apres"><div class="anneau-fond abs" style="left:50%;top:50%">${anneau(330, 26, "#CD2128", 0.22)}</div>
      <div class="titre ea" style="font-size:210px;position:relative">${mots("Et")} ${mots("après ?")}</div></div>`,
  (t, el, A) => {
    const c = el.querySelector(".carte");
    const pd = tw(t, 0.4, 3.6, E.out);
    const sortie = tw(t, 26, 27.6, E.inout);
    const x = lerp(-260, -260, pd) + sortie * 80, y = lerp(-1250, 0, pd) + sortie * 520;
    const rx = lerp(70, 14, pd), rz = lerp(-24, -5, pd) + sortie * 30;
    const sc = lerp(1, 1, pd) * (1 - sortie * 0.78);
    c.style.transform = `translate3d(${x}px, ${y}px, 0) rotateX(${rx + Math.sin(A * .6) * 1.2}deg) rotateY(${Math.sin(A * .4) * 2}deg) rotateZ(${rz}deg) scale(${sc})`;
    vis(c, Math.min(1, prog(t, 0.4, 0.9)) * (1 - prog(t, 27.4, 27.8)));
    texte(el.querySelector(".q"), t, 4.4, 25.2, 0.12, 1.0);
    vis(el.querySelector(".fictif"), prog(t, 3, 4) * (1 - prog(t, 25, 26)));
    // boîte à chaussures : les cartons tombent
    const boite = el.querySelector(".boite"); vis(boite, prog(t, 25.6, 26.4) * (1 - prog(t, 33, 34)));
    boite.querySelectorAll("path").forEach((p, k) => { const L = 2600; p.style.strokeDasharray = L; p.style.strokeDashoffset = L * (1 - tw(t, 25.6 + k * .3, 27 + k * .3, E.inout)); });
    el.querySelectorAll(".mini").forEach((m, k) => {
      const d = minisData[k]; const p = tw(t, d.d, d.d + 0.75, E.back);
      m.style.transform = `translate(${d.x}px, ${lerp(-180, d.y, p)}px) rotate(${d.r * p + (1 - p) * 40}deg)`;
      vis(m, prog(t, d.d, d.d + .05) * (1 - prog(t, 33, 34)));
    });
    // « Et après ? »
    const ap = el.querySelector(".apres"); vis(ap, prog(t, 34.6, 35.2));
    texte(el.querySelector(".ea"), t, 35.4, 1e9, 0.14, 1.1);
    const an = el.querySelector(".anneau-fond"); const pa = tw(t, 35, 37.5, E.expo);
    an.style.transform = `translate(-50%,-50%) rotate(${lerp(-60, 0, pa) + A * 4}deg) scale(${lerp(.6, 1, pa)})`; an.style.opacity = pa * .95;
    ouvrir(an.querySelector("svg"), 0.22 + Math.sin(A * 1.3) * 0.015);
  });
  var minisData = minis;
}

// ------------------------------------------------------------ 2. ENTRE DEUX ÉVÉNEMENTS (45–120)
{
  const N = 220, R = rng(42); const P = [];
  for (let k = 0; k < N; k++) { const a = R() * Math.PI * 2, r = 40 + Math.pow(R(), .7) * 250;
    P.push({ a, r, dx: 280 + R() * 520, dy: (R() - .5) * 260, f: 23 + R() * 13, s: 1.4 + R() * 2.6, rouge: R() < .28 }); }
  scene(45, 120, `
    <div class="centre c1"><div class="titre l" style="font-size:104px;max-width:1500px">${mots("Ce qui se passe")}<br>${mots("entre deux événements.")}</div></div>
    <canvas class="abs res" width="1920" height="1080" style="left:0;top:0"></canvas>
    <div class="abs etiquette n1" style="left:180px;top:720px;width:360px;text-align:center">Foire du Valais</div>
    <div class="abs etiquette n2" style="left:1380px;top:720px;width:360px;text-align:center">Prochain événement du Club</div>
    <div class="abs titre vide" style="left:0;right:0;top:480px;text-align:center;font-size:120px;color:var(--rouge2)">${mots("l'après.")}</div>
    <div class="abs oui-fond" style="inset:0;background:var(--blanc)"></div>
    <div class="centre oui"><div class="titre o" style="font-size:400px;color:var(--encre);letter-spacing:-0.05em">${mots("Oui.")}</div>
      <div class="sous" style="font-size:40px;color:#6B7280;font-weight:500;margin-top:10px">(pas « on s'appelle »)</div></div>
    <div class="centre jm"><div class="titre h" style="font-size:132px">${mots("L'homme qui")}<br>${mots("disait oui.")}</div></div>`,
  (t, el, A) => {
    texte(el.querySelector(".l"), t, 1, 13.4, 0.09, 1);
    const cv = el.querySelector(".res"), g = cv.getContext("2d"); g.clearRect(0, 0, 1920, 1080);
    const on = prog(t, 14, 15) * (1 - prog(t, 46, 47));
    vis(cv, on); vis(el.querySelector(".n1"), on * prog(t, 15, 16)); vis(el.querySelector(".n2"), on * prog(t, 16, 17));
    if (on > 0) {
      const X1 = 360, X2 = 1560, Y = 640, ax = tw(t, 14.5, 17, E.inout);
      g.strokeStyle = "rgba(245,243,239,.35)"; g.lineWidth = 2; g.beginPath(); g.moveTo(X1, Y); g.lineTo(lerp(X1, X2, ax), Y); g.stroke();
      const pts = [];
      for (const p of P) {
        const b = tw(t, 17, 20.5, E.expo); const dr = tw(t, 21, 40, E.inout);
        const x = X1 + Math.cos(p.a) * p.r * b + p.dx * dr, y = Y + Math.sin(p.a) * p.r * b * .62 + p.dy * dr * .4 - 40 * b;
        const al = prog(t, 17, 17.6) * (1 - prog(t, p.f, p.f + 2.2));
        if (al > 0) pts.push([x, y, al, p]);
      }
      for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[i][0] - pts[j][0], dy = pts[i][1] - pts[j][1], d = dx * dx + dy * dy;
        if (d < 8100) { g.strokeStyle = `rgba(245,243,239,${Math.min(pts[i][2], pts[j][2]) * (1 - Math.sqrt(d) / 90) * .32})`; g.lineWidth = 1; g.beginPath(); g.moveTo(pts[i][0], pts[i][1]); g.lineTo(pts[j][0], pts[j][1]); g.stroke(); }
      }
      for (const [x, y, al, p] of pts) { g.fillStyle = p.rouge ? `rgba(255,59,68,${al})` : `rgba(245,243,239,${al * .9})`; g.beginPath(); g.arc(x, y, p.s, 0, 7); g.fill(); }
      for (const [X, k] of [[X1, 0], [X2, 1]]) { const pu = k ? .5 + .5 * Math.sin(A * 2.2) : 1; const a = prog(t, 15 + k, 16 + k);
        g.fillStyle = `rgba(205,33,40,${a})`; g.beginPath(); g.arc(X, Y, 13, 0, 7); g.fill();
        g.strokeStyle = `rgba(255,59,68,${a * .5 * pu})`; g.lineWidth = 2; g.beginPath(); g.arc(X, Y, 26 + (k ? 10 * (1 - pu) : 0), 0, 7); g.stroke(); }
    }
    texte(el.querySelector(".vide"), t, 40.5, 46.2, 0.1, 1.2);
    const of = el.querySelector(".oui-fond"); vis(of, prog(t, 47, 47.35) * (1 - prog(t, 70, 70.2)));
    const ou = el.querySelector(".oui"); vis(ou, prog(t, 47.2, 47.3) * (1 - prog(t, 70, 70.2)));
    texte(el.querySelector(".o"), t, 47.6, 1e9, 0, 1.1);
    const o = el.querySelector(".o"); o.style.transform = `scale(${lerp(1.08, 1, tw(t, 47.6, 52, E.out))})`;
    vis(el.querySelector(".sous"), prog(t, 49, 50));
    vis(el.querySelector(".jm"), prog(t, 71.5, 71.6));
    texte(el.querySelector(".h"), t, 71.8, 74.2, 0.12, 1);
  });

// ============================================================ moteur
const lueur = $("#lueur"), hudChap = $("#hud-chap"), hud = $("#hud");
function rendre(t, A) {
  for (const s of SC) {
    const on = t >= s.t0 && t < s.t1;
    s.el.style.display = on ? "block" : "none";
    if (on) s.maj(t - s.t0, s.el, A);
  }
  const ch = CH.find(c => t >= c.t0 && t < c.t1) || CH[CH.length - 1];
  hudChap.textContent = ch.film ? "" : ch.nom;
  const hv = !ch.film && !(t > 597 && t < 600.5) && !(t >= 92 && t < 115) ? 1 : 0;
  hud.style.opacity = hv * (t < 2 ? prog(t, 1, 2) : 1);
  // lueur rouge, lente, différente par chapitre
  const i = CH.indexOf(ch), ang = A * .05 + i * 1.7;
  const lx = 50 + Math.cos(ang) * 22, ly = 55 + Math.sin(ang * 1.3) * 18;
  const fort = ch.film ? 0 : (t >= 92 && t < 115 ? 0 : .22);
  lueur.style.background = `radial-gradient(40% 50% at ${lx}% ${ly}%, rgba(205,33,40,${fort}), transparent 70%), radial-gradient(30% 40% at ${100 - lx}% ${100 - ly}%, rgba(80,90,120,${fort * .5}), transparent 70%)`;
}

const RENDU = new URLSearchParams(location.search).has("rendu");
const scene_ = $("#scene");
function ajuster() { const k = Math.min(innerWidth / 1920, innerHeight / 1080); scene_.style.transform = `translate(${(innerWidth - 1920 * k) / 2}px, ${(innerHeight - 1080 * k) / 2}px) scale(${k})`; }
if (RENDU) {
  window.seek = t => { rendre(t, t); return document.fonts.ready.then(() => true); };
  window.DUREE = FIN;
} else {
  ajuster(); addEventListener("resize", ajuster);
  let t = 0, dernier = performance.now(), arret = null, filmOk = false;
  const film = $("#film");
  film.addEventListener("loadeddata", () => { filmOk = true; });
  film.addEventListener("ended", () => { film.style.display = "none"; t = 265; arret = null; });
  const prochain = () => REPERES.find(r => r[0] > t + 1e-6);
  function suivant() {
    if (film.style.display === "block") { film.pause(); film.style.display = "none"; t = 265; arret = null; return; }
    if (arret) { t = arret[1]; arret = null; }
    else { const r = prochain(); if (r && !(t >= 120 && t < 265)) { t = r[0]; arret = r; return; } }
    if (t >= 120 && t < 265 && filmOk) { film.currentTime = 0; film.style.display = "block"; film.play(); }
  }
  function precedent() { const r = [...REPERES].reverse().find(r => r[1] < t - .5); t = r ? r[1] : 0; arret = null; }
  addEventListener("keydown", e => {
    if (e.key === " " || e.key === "ArrowRight" || e.key === "PageDown" || e.key === "Enter") { e.preventDefault(); suivant(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") precedent();
    else if (e.key >= "1" && e.key <= "8") { const c = CH[+e.key - 1]; t = c.t0; arret = null; film.pause(); film.style.display = "none"; }
    else if (e.key === "d" || e.key === "D") { t = 310; arret = null; }
    else if (e.key === "f" || e.key === "F") document.documentElement.requestFullscreen?.();
    else if (e.key === "h" || e.key === "H") { const a = $("#aide"); a.style.display = a.style.display === "block" ? "none" : "block"; }
  });
  addEventListener("click", suivant);
  (function boucle(now) {
    const dt = Math.min(.1, (now - dernier) / 1000); dernier = now;
    if (!arret && film.style.display !== "block") {
      const r = prochain(); const nt = t + dt;
      if (r && nt >= r[0]) { t = r[0]; arret = r; if (t >= 120 && t < 121 && filmOk) {} } else t = Math.min(nt, FIN - .01);
      if (t >= 120 && t < 120.2 && filmOk && film.style.display !== "block") { film.currentTime = 0; film.style.display = "block"; film.play(); }
    }
    rendre(t, now / 1000);
    requestAnimationFrame(boucle);
  })(performance.now());
}
