<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questions du jury</title>
<style>
:root { --fond: #f2f3f5; --carte: #fff; --encre: #141923; --doux: #5b6270; --rouge: #CD2128; --vert: #1F8A4C; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fond: #0b0d12; --carte: #171a21; --encre: #f4f5f7; --doux: #9aa1ad; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--encre); font: 18px/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 16px; }
h1 { font-size: 22px; margin: 8px 0; }
.outils { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 16px; }
select, button { font: inherit; font-size: 16px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--doux); background: var(--carte); color: var(--encre); }
button.principal { background: var(--rouge); color: #fff; border-color: var(--rouge); font-weight: 700; }
.carte { background: var(--carte); border-radius: 16px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
.jury { color: var(--doux); font-size: 15px; } .q { font-size: 26px; font-weight: 800; margin: 8px 0 16px; }
.chrono { font: 700 34px Menlo, monospace; } .chrono.fini { color: var(--rouge); }
.reponse { margin-top: 16px; } .reponse[hidden] { display: none; }
.r { font-size: 20px; } .meta { font-size: 14px; color: var(--doux); margin-top: 12px; } .meta b { color: var(--encre); }
.piege { border-left: 4px solid var(--rouge); padding-left: 10px; margin-top: 10px; font-size: 15px; }
.compte { color: var(--doux); font-size: 14px; }
</style></head>
<body><main>
<h1>Questions du jury — entraînement</h1>
<p class="compte">Une question au hasard. Réponds à voix haute en 15 à 30 secondes, puis compare. Espace : révéler ·
→ : question suivante.</p>
<div class="outils">
  <select id="jury" aria-label="Jury"><option value="">Tous les jurys</option></select>
  <label><input type="checkbox" id="top"> top 20 seulement</label>
  <button class="principal" id="suivante">Question suivante →</button>
  <button id="reveler">Révéler la réponse</button>
  <span class="chrono" id="chrono" aria-live="off">0:30</span>
</div>
<div class="carte">
  <div class="jury" id="qui"></div>
  <div class="q" id="question"></div>
  <div class="reponse" id="reponse" hidden>
    <div class="r" id="r"></div>
    <div class="piege" id="piege"></div>
    <div class="meta"><b>Preuve</b> : <span id="preuve"></span></div>
  </div>
</div>
<p class="compte" id="compte"></p>
</main>
<script>
const QS = [{"jury": "Direction de la Foire du Valais", "q": "Concrètement, qu'est-ce que la Foire y gagne ?", "r": "La Foire crée la rencontre. Ce qui manque, c'est l'après : personne ne sait ce que deviennent les contacts. Club Pulse donne au Club un moyen de suivre ce qui se passe après, avec des chiffres agrégés. Pour les exposants, on a prévu un parcours « Allumage Foire » d'ici la Foire 2027 : il n'est pas encore construit.", "preuve": "docs/roadmap/ROADMAP.md (Jalon 3 « Grandir ») ; docs/presentation/03_SCRIPT_ORAL_v2.md (phrase finale) ; CLAIMS n° 43, 47 (Suivi, test_foire_suivi.py)", "ne_pas_dire": "« On va augmenter la fréquentation / les retombées de la Foire. » (rien n'est mesuré)", "top20": false}, {"jury": "Direction de la Foire du Valais", "q": "Vous dites que personne ne mesure l'après. Vous, comment vous le mesurez ?", "r": "Chaque oui laisse un reçu. Le reçu passe par quatre étapes : accord, essai, résultat, ou retiré. C'est le Club qui déclare le résultat : signé, test sans suite, contact établi, abandonné. L'écran Suivi compte tout ça, en agrégats. Aujourd'hui, les chiffres viennent d'un monde fictif. Les vrais chiffres viendront du pilote.", "preuve": "CLAIMS n° 47 (test_foire_suivi.py::test_machine_a_etats_explicite) ; n° 43 ; docs/roadmap/SUIVI_METRIQUES.md", "ne_pas_dire": "« 80 % des contacts de salon ne sont jamais rappelés. » (statistique contestée, invérifiable — PREUVES.md, section Contexte)", "top20": false}, {"jury": "Direction de la Foire du Valais", "q": "Combien de personnes ont utilisé Club Pulse pendant la Foire ?", "r": "Personne, en vrai. Le produit tourne sur un monde fictif de 150 profils, et chaque écran le dit. Ce qu'on a recueilli de réel : 21 phrases, par le QR de la Foire. On les montre seulement en agrégats. C'est le seul point qu'on compte comme validé sur le terrain. Le reste, c'est le pilote qui le dira.", "preuve": "docs/roadmap/etat.yaml (id: tally, seul statut « valide ») ; docs/presentation/deck/data/gel.json (v2.tally) ; CLAIMS n° 77", "ne_pas_dire": "« Nos utilisateurs… » ; lire ou résumer une phrase Tally ; « validé sur le terrain » pour autre chose que les 21 phrases.", "top20": true}, {"jury": "Direction de la Foire du Valais", "q": "Et les exposants qui ne sont pas membres du Club ?", "r": "Le Club peut leur donner un passe découverte. Il est signé, utilisable une fois, valable 90 jours, limité à trois demandes, et le Club peut le révoquer. L'invité peut proposer son aide. Mais sa proposition ne remplit jamais une place à elle seule : une personne du Club confirme. « Rejoindre le Club » enregistre une intention, rien de plus.", "preuve": "CLAIMS n° 49, 51, 52 (test_foire_decouverte.py::test_une_proposition_d_invite_ne_remplit_jamais_une_capacite) ; E2E test_e2e_foire.py::test_le_jure_devient_exposant_invite_d_annecy", "ne_pas_dire": "« Les exposants deviennent membres » ; « taux de conversion » (dire « intention d'adhésion » ; la suite est simulée en démonstration).", "top20": false}, {"jury": "Direction de la Foire du Valais", "q": "La Haute-Savoie est région d'honneur cette année. Vous travaillez avec elle ?", "r": "Non, pas encore. C'est une piste à contacter, pendant la Foire. La Vallée d'Aoste et Crans-Montana 2027 aussi : à contacter. Aucun partenaire n'est acquis, et on ne le présente pas comme tel.", "preuve": "docs/roadmap/ROADMAP.md (« Pistes de partenaires — toutes à contacter ») ; etat.yaml (id: partenaire_fr, note « aucun partenaire acquis ») ; CLAIMS n° 100", "ne_pas_dire": "« Notre partenaire haut-savoyard » ; « on est en discussion avec… » (aucune trace dans le dépôt).", "top20": true}, {"jury": "Direction de la Foire du Valais", "q": "Si la démo plante devant le public, vous faites quoi ?", "r": "On a un plan B pour chaque étape. Si personne ne peut scanner, on montre une vidéo de 30 secondes, enregistrée sur le vrai écran, et on dit que c'est une séance simulée. Si le serveur tombe, on le relance : il revient exactement dans le même état. C'est un test, avec un arrêt brutal du serveur. Et la version 1 de la présentation reste prête.", "preuve": "CLAIMS n° 5, 18 (test_redemarrage_kill9.py) ; docs/presentation/03_SCRIPT_ORAL_v2.md (Plan B acte 3) ; docs/RAPPORT_NUIT.md (« 3 - Passer en v1 »)", "ne_pas_dire": "« Ça ne peut pas planter. »", "top20": true}, {"jury": "Direction de la Foire du Valais", "q": "Les visiteurs qui scannent votre QR aujourd'hui : vous gardez leurs données ?", "r": "Non. Aucun nom, aucun compte : chaque scan donne un passe de deux heures. Après la présentation, une commande efface tout : participants, réponses, reçus. La clé change, donc les anciens QR ne marchent plus. Et chaque écran le dit : « vos données sont effacées après la présentation ».", "preuve": "CLAIMS n° 67, 73 (test_salle.py::test_purge_totale…, E2E test_e2e_salle.py)", "ne_pas_dire": "« On n'a collecté aucune donnée. » (on en collecte pendant la séance, puis on purge) ; « on vous recontactera ».", "top20": false}, {"jury": "Direction de la Foire du Valais", "q": "Et pour la Foire 2027, vous proposez quoi ?", "r": "Le jalon « Grandir » va jusqu'à la Foire 2027. Idée : des QR sur les stands, le passe découverte, et compter les adhésions qui en viennent. C'est prévu, pas construit pour les stands. Et ça dépend d'abord du pilote de janvier.", "preuve": "docs/roadmap/ROADMAP.md (Jalon 3 « Grandir ») ; etat.yaml (passe découverte : construit ; partenaire_fr : prévu)", "ne_pas_dire": "Un nombre d'adhésions ou d'exposants attendu (aucun dans le dépôt).", "top20": false}, {"jury": "Comité du Club des Affaires", "q": "Nos membres ont déjà trop d'applications. Pourquoi ils utiliseraient celle-là ?", "r": "Parce qu'on ne leur demande pas d'aller sur une plateforme. Ils reçoivent une demande précise, et ils répondent avec un bouton : oui, non, ou pas cette fois. Au plus une demande par semaine, c'est testé. On peut aussi répondre depuis l'e-mail : c'est construit, mais l'envoi est simulé aujourd'hui. Est-ce qu'ils répondront vraiment ? On ne sait pas encore. C'est la question du pilote.", "preuve": "CLAIMS n° 26 (test_capacites_regles.py), n° 29 (E2E test_etabli_telephones_reponse_recu_retrait_anonyme), n° 58, 59 (test_foire_distance.py)", "ne_pas_dire": "« Ça prend dix secondes » (jamais chronométré) ; « sans compte » pour un membre.", "top20": true}, {"jury": "Comité du Club des Affaires", "q": "Avec 145 entreprises, on finira toujours par deviner qui a dit non.", "r": "Parfois, oui. On ne vous promet pas le contraire. Ce qu'on garantit, et c'est testé : on ne nomme jamais personne, on ne demande jamais pourquoi. Tout chiffre qui vient de moins de trois entreprises s'affiche « moins de trois ». Deux représentants de la même entreprise comptent une fois. Le téléphone dit « personne ne sera prévenu que c'est vous », pas « personne ne saura ».", "preuve": "CLAIMS n° 41, 42 (test_foire_anonymat.py::test_message_de_retrait_ne_promet_pas_l_impossible), n° 43 ; docs/roadmap/FINANCEMENT_JURIDIQUE.md (seuil en entreprises distinctes)", "ne_pas_dire": "« Personne ne saura jamais » ; « anonymat garanti ».", "top20": true}, {"jury": "Comité du Club des Affaires", "q": "Vous avez notre liste de membres. Qu'est-ce que vous en avez fait ?", "r": "On n'a gardé que la colonne métier. Aucun nom n'est dans notre code. On s'en sert pour compter : 145 entreprises, 25 métiers. D'après la liste, le Club pourrait assembler 8 capacités types sur 9 ; il manque un interprète. Le classement par métier, c'est nous qui l'avons proposé : il est à confirmer avec vous.", "preuve": "CLAIMS n° 56, 87, 88 (test_assembler.py::test_liste_du_club_huit_sur_neuf…) ; PREUVES.md, section « Liste du Club »", "ne_pas_dire": "Un nom de membre ; « un de vos membres exploite déjà le train vers la France » ou tout fait sur un membre précis (non vérifié, retiré du deck).", "top20": false}, {"jury": "Comité du Club des Affaires", "q": "Qui fait le travail au quotidien ? Notre secrétariat est déjà chargé.", "r": "Le secrétariat garde un rôle, à temps partiel : clôturer les reçus, relayer les annonces, présenter le bilan. On a construit ce qui l'allège : un tableau des demandes bloquées, un bilan généré automatiquement, avec les mêmes chiffres que l'écran. Combien d'heures par semaine ? On ne l'a pas mesuré. Le pilote le dira.", "preuve": "docs/roadmap/ROADMAP.md (« Équipe », risque « Le secrétariat porte trop ») ; CLAIMS n° 61, 97, 99 (test_foire_bilan.py, test_tableau_bord.py)", "ne_pas_dire": "« Zéro travail pour le secrétariat » ; un nombre d'heures.", "top20": true}, {"jury": "Comité du Club des Affaires", "q": "Pourquoi faire le pilote pendant les Mondiaux ? Nos membres seront débordés.", "r": "C'est voulu. Quand tout le monde manque de tout, est-ce que l'entraide tient ? C'est le test le plus dur. On protège les membres : une demande à la fois, un plafond par semaine, et « pas cette fois » ne coûte rien. Si ça ne tient pas, on le saura en février, avant d'investir plus.", "preuve": "docs/roadmap/ROADMAP.md (Jalon 2, « Risque nommé », Mondiaux 1er – 14.02.2027) ; docs/presentation/07_QA_JURY.md", "ne_pas_dire": "« L'entraide tiendra, on en est sûrs. »", "top20": true}, {"jury": "Comité du Club des Affaires", "q": "Cinquante volontaires sur 173 représentants : et si vous ne les trouvez pas ?", "r": "On ne sait pas encore si on les trouvera. Aujourd'hui, on n'a aucun volontaire inscrit. Le plan : les recruter lors d'un événement du Club, avec le mode salle que vous avez vu. Si on n'arrive pas à cinquante, c'est déjà une réponse utile pour le Club.", "preuve": "docs/roadmap/ROADMAP.md (Jalon 1, « Recrutement de 50 volontaires ») ; etat.yaml (id: pilote, prévu)", "ne_pas_dire": "« On a déjà des volontaires » ; « nos membres sont partants ».", "top20": false}, {"jury": "Comité du Club des Affaires", "q": "Comment saura-t-on si le pilote a réussi ? Et qui décide ?", "r": "Les critères sont écrits d'avance, et c'est vous qui les validez. Ce qu'on propose : au moins 25 demandes, au moins 30 % de oui, un premier oui en moins de 72 heures en médiane, au moins 15 membres actifs sur 50, zéro incident de confidentialité. Avec ce volume, c'est un signal, pas une mesure fine. Le comité décide.", "preuve": "docs/roadmap/ROADMAP.md (tableau des critères, « à valider avec le Club ») ; docs/roadmap/SUIVI_METRIQUES.md", "ne_pas_dire": "« Ce sera statistiquement significatif » ; présenter les seuils comme acceptés par le Club.", "top20": true}, {"jury": "Comité du Club des Affaires", "q": "Est-ce que nous, au comité, on verra qui fait quoi ?", "r": "Vous verrez des chiffres agrégés : demandes, réponses, partenariats par étape. Une ligne avec un nom n'apparaît que si le membre ET le Club l'ont accepté. Si l'un retire son accord, la ligne disparaît. On ne suit jamais qui ne répond pas, ni qui a lu quoi.", "preuve": "CLAIMS n° 44, 45 (test_foire_suivi.py::test_ligne_nominative_seulement_sous_double_accord) ; docs/roadmap/SUIVI_METRIQUES.md (« Ce qu'on ne suit jamais »)", "ne_pas_dire": "« Vous verrez qui ne joue pas le jeu » ; « vous aurez la liste des inactifs ».", "top20": false}, {"jury": "Expert technique", "q": "Aujourd'hui, concrètement, où tourne la démo et où sont les données ?", "r": "Sur notre machine, ici à Martigny. Le serveur n'écoute que sur la machine elle-même ; un tunnel chiffré lui donne une adresse publique. Le tunnel principal, c'est Tailscale Funnel ; en secours, Cloudflare. On n'a pas de budget d'hébergement pour la Foire. Le pilote, lui, serait hébergé en Suisse : ce n'est pas encore fait.", "preuve": "docs/DEMO_TUNNEL.md ; CLAIMS n° 83 (classe B : vrai le jour J seulement si lancé ainsi) ; docs/roadmap/ROADMAP.md (Jalon 1)", "ne_pas_dire": "« C'est hébergé dans un cloud suisse » ; « c'est en production ».", "top20": true}, {"jury": "Expert technique", "q": "Le service de tunnel peut-il lire ce qui passe ?", "r": "Ça dépend du tunnel. Avec Tailscale Funnel, le chiffrement se termine sur notre machine : le relais ne peut pas lire les données. Avec le secours Cloudflare, le chiffrement se termine chez Cloudflare : techniquement, il peut lire. Et c'est ce que disent les fournisseurs ; nos tests ne le vérifient pas.", "preuve": "CLAIMS n° 84 (classe C : documentation des fournisseurs, non vérifié par nos tests) ; docs/DEMO_TUNNEL.md (tableau « Le relais peut-il lire »)", "ne_pas_dire": "« Le relais ne peut pas lire les données » sans préciser « avec Tailscale Funnel, pas avec le secours Cloudflare » — et jamais si le secours est en service.", "top20": false}, {"jury": "Expert technique", "q": "Quelqu'un dans la salle peut-il prendre la main sur votre console ?", "r": "On l'a fermée. Une requête qui passe par un tunnel n'est jamais traitée comme venant de notre machine. La console exige un jeton secret, et le script de lancement refuse de démarrer sans lui. Le QR de la salle et son jeton ne sortent pas par le tunnel. Il reste des points connus : le jeton est visible dans la liste des processus du Mac, et il n'est jamais renouvelé.", "preuve": "CLAIMS n° 11, 85 (tests/test_tunnel.py::test_requete_relayee_par_un_tunnel_n_est_pas_locale ; test_deploiement.py::test_lanceur_tunnel_exige_jeton_et_https) ; docs/RAPPORT_NUIT.md (Audit, constat 2 ; « Restent (mineurs, dits) »)", "ne_pas_dire": "« C'est impossible à pirater » ; « c'est sécurisé ».", "top20": true}, {"jury": "Expert technique", "q": "Quatre-vingts téléphones en même temps, ça tient vraiment ?", "r": "On l'a mesuré avec 80 téléphones simulés : zéro erreur, et moins de 210 millisecondes pour 95 % des requêtes. Mais c'était sur un serveur local, pas à travers Internet. On le dit. Derrière un tunnel, tout le monde a la même adresse IP : on ne limite donc jamais par IP. De vrais téléphones à travers le tunnel : c'est la vérification du matin, pas une mesure du dépôt.", "preuve": "CLAIMS n° 76 (classe B, scripts/charge_salle.py --local --n 80), n° 86 (test_tunnel.py::test_quatre_vingts_telephones_derriere_une_seule_ip_ne_sont_pas_bloques), n° 16 ; docs/DEMO_TUNNEL.md ; PREUVES.md (« Mode salle — charge »)", "ne_pas_dire": "« Testé avec 80 vrais téléphones » ; « ça tient n'importe quelle charge ».", "top20": false}, {"jury": "Expert technique", "q": "Comment savez-vous que vos tests testent vraiment quelque chose ?", "r": "Deux choses. Chaque correction commence par un test qui échoue, puis on corrige. Et on a cassé exprès le cœur du registre, plus de 1 300 fois : 1 229 versions cassées ont été attrapées ; les 98 autres ont été examinées une par une. La suite passe sur notre machine ; la CI GitHub n'a pas tourné sur les derniers commits, donc on ne dit pas « CI verte ».", "preuve": "CLAIMS n° 10 (1 229 / 1 327, docs/audit/mutants_survivants.txt), n° 33 ; docs/presentation/deck/data/gel.json ; docs/RAPPORT_NUIT.md (« Portes locales », « CI : n'a pas tourné »)", "ne_pas_dire": "« CI verte » sur la branche foire-2026 ; « 100 % de couverture ».", "top20": false}, {"jury": "Expert technique", "q": "Authentification, chiffrement, audit de sécurité : c'est prêt pour la production ?", "r": "Non. Aujourd'hui, les membres entrent avec des codes d'invitation de démonstration ; l'authentification du Club n'est pas branchée. Il n'y a pas de chiffrement des données sur le disque. On a fait relire le code par un audit interne, et les points bloquants sont corrigés. Un audit de sécurité externe est prévu avant le lancement.", "preuve": "docs/THREAT_MODEL.md (§ 4 « Hors portée ») ; etat.yaml (id: audit_externe, prévu) ; docs/RAPPORT_NUIT.md (section « Audit »)", "ne_pas_dire": "« C'est prêt pour la production » ; « c'est audité » (sans préciser : audit interne, pas externe).", "top20": true}, {"jury": "Expert technique", "q": "Le serveur s'arrête net pendant la démo. Qu'est-ce qu'on perd ?", "r": "Rien de ce qui est enregistré. Tout passe par un journal, et le journal est la source de vérité. On l'a testé en tuant le serveur brutalement : à la relance, on retrouve le même monde, les sessions, l'étape de la démo.", "preuve": "CLAIMS n° 5, 18 (test_redemarrage_kill9.py : vrai uvicorn, SIGKILL)", "ne_pas_dire": "« On ne perd jamais rien, nulle part » (pas de sauvegarde ni multi-instance : THREAT_MODEL § 4).", "top20": false}, {"jury": "Expert technique", "q": "Et pour le pilote, l'hébergement ?", "r": "Le paquet de déploiement est prêt : une image, un serveur web avec HTTPS automatique, des scripts de déploiement et de purge, sans aucun secret dans les fichiers. Mais rien n'est déployé. Au jalon « Lancer », il faut l'héberger en Suisse, ajouter des sauvegardes chiffrées et la supervision.", "preuve": "CLAIMS n° 75 (test_deploiement.py ; « le déploiement réel n'a pas été fait ») ; docs/roadmap/ROADMAP.md (Jalon 1)", "ne_pas_dire": "« C'est déjà déployé » ; « ça tourne déjà sur un VPS ».", "top20": false}, {"jury": "Expert IA", "q": "Une bonne réponse sur 26. Franchement, c'est mauvais, non ?", "r": "Oui, c'est faible, et on le dit tel quel. C'est notre premier prompt, sur 26 cas écrits d'avance. Les 25 autres fois, nos règles ont arrêté la proposition. Au total, ce que voit le membre est juste 17 fois sur 26, contre 16 avec les règles seules. Ça ne dit rien d'Apertus en général : ça dit que notre prompt ne suffit pas pour cette tâche.", "preuve": "CLAIMS n° 39 (classe B, make banc-ia → prototype/eval/resultats_comprendre_action.md) ; PREUVES.md (rejeu du 03.10 : inchangé) ; docs/roadmap/APERTUS_PLAN.md", "ne_pas_dire": "« Apertus est mauvais » ; « c'est un bon score » ; « le produit n'a jamais montré une proposition fausse » (le membre voit encore 9 cas sur 26 faux, venus des règles).", "top20": true}, {"jury": "Expert IA", "q": "Alors pourquoi garder l'IA ?", "r": "Pour une seule chose : lire les mots du membre et proposer une structure, pour lui éviter un formulaire. Elle ne choisit jamais une capacité, un consentement ou un destinataire. C'est testé. IA allumée ou éteinte, l'état du Club est le même : c'est aussi un test. La démo de scène tourne sans modèle.", "preuve": "CLAIMS n° 1 (test_frontiere_ia.py, test_provenance_ia.py), n° 7 (test_parite_ia.py, non vacueux) ; docs/roadmap/APERTUS_PLAN.md", "ne_pas_dire": "« Propulsé par Apertus » (dire « on a sondé et mesuré Apertus ») ; « l'IA trouve les bons partenaires ».", "top20": false}, {"jury": "Expert IA", "q": "Comment vous empêchez une hallucination d'arriver chez le membre ?", "r": "La proposition passe par des règles : format, vocabulaire du Club, bornes, catalogue, aucune donnée personnelle. Si elle échoue, le membre voit le formulaire, et c'est dit à l'écran. Et le membre confirme toujours. Mais une sortie qui passe les règles peut être fausse : avec l'appel d'outils, 3 sorties fausses sont passées. Donc on l'a laissé éteint.", "preuve": "CLAIMS n° 38 (test_ia_preparer_action.py, E2E test_e2e_ia.py), n° 89 (apertus-outils : 1/26, 3 fausses acceptées) ; test_frontiere_ia.py::test_entite_inventee_rejetee", "ne_pas_dire": "« L'IA ne peut pas halluciner » ; « aucune erreur ne passe ».", "top20": true}, {"jury": "Expert IA", "q": "Pourquoi Apertus et pas un grand modèle américain ?", "r": "Parce que le Club veut une IA suisse et ouverte, servie en Suisse : Apertus 1.5, servi par le CSCS à Lugano. Et notre architecture ne dépend pas du modèle : on peut en brancher un autre. Pour les 21 phrases de la Foire, on a promis « une IA suisse » : le code refuse tout autre modèle.", "preuve": "CLAIMS n° 8 (sonde), n° 64 (test_foire_tally.py::test_consentement…) ; PREUVES.md (point d'accès api.inference.cscs.ch) ; docs/roadmap/APERTUS_PLAN.md", "ne_pas_dire": "« Public AI » (dire « CSCS ») ; « Apertus est meilleur que les modèles américains » (non mesuré).", "top20": true}, {"jury": "Expert IA", "q": "Qu'est-ce qui part vers le modèle, exactement ?", "r": "Seulement le texte tapé par le membre. On remplace les noms par des pseudonymes, on retire les noms, courriels et téléphones qu'on connaît. Jamais un profil, jamais la base. Limite connue : un nom propre qu'on ne connaît pas, écrit dans le texte, n'est pas reconnu.", "preuve": "docs/THREAT_ const $ = (s) => document.querySelector(s);

function melanger() { pile = filtre().slice(); for (let i = pile.length - 1; i > 0; i--) { const k = Math.floor(Math.random() * (i + 1)); [pile[i], pile[k]] = [pile[k], pile[i]]; } }
function chrono() {

}
function suivante() {
