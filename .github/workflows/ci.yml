name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: prototype
    env:
      HACKVS_SEMANTIQUE: "0"   # le modèle local (2,2 Go) n'est pas téléchargé en CI : son test est ignoré
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dépendances (versions exactes de constraints.txt)
        run: pip install -r requirements-dev.txt -c constraints.txt
      - name: Aucun secret dans le dépôt
        run: python scripts/verifier_secrets.py
      - name: Lint
        run: ruff check .
      - name: Contrôle de types (mypy, plugin Pydantic) — toutes les couches
        run: python -m mypy app adaptateurs plateforme intelligence
      - name: Tests (domaine, API, sécurité, concurrence, frontière IA, invariants, observabilité)
        run: python -m pytest -q
      - name: Non-régression des évaluations (aucune violation ajoutée, aucun succès perdu)
        run: python -m eval.run_eval --verifier
      - name: Plateforme de décision (20 scénarios, attendus fixés avant exécution)
        run: python -m eval.eval_decisions --verifier
      - name: Cohérence pitch ↔ code (registre des preuves, chiffres du pitch, routes de la démo)
        run: python scripts/validate_competition_claims.py --sans-benchmark --verifier

  salle:
    # MODE SALLE : les E2E comme dans la salle de la Foire — espace réseau vide (seule la boucle locale), extérieur
    # injoignable VÉRIFIÉ par scripts/mode_salle.py, aucune configuration du fournisseur de langage (IA OFF, vérifié
    # côté serveur par la fixture). Chromium ne résout de toute façon aucun domaine externe (E2E hermétiques).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: prototype
    env:
      HACKVS_SEMANTIQUE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dépendances
        run: pip install -r requirements-dev.txt -c constraints.txt
      - name: Navigateur
        run: python -m playwright install --with-deps chromium
        timeout-minutes: 10              # un téléchargement bloqué échoue vite au lieu de geler la CI 6 h (run #157)
      - name: E2E en mode salle (réseau local seul, IA OFF)
        run: >-
          sudo -E env "PATH=$PATH" "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright"
          HACKVS_FOIRE=1 HACKVS_E2E_OBLIGATOIRE=1 HACKVS_E2E_ECHECS="$PWD/var/e2e_echecs_salle"
          unshare --net python scripts/mode_salle.py --
          python -m pytest -q -p no:cacheprovider tests/test_e2e_scene.py tests/test_e2e_pulse.py tests/test_e2e_action.py tests/test_e2e_capacites.py tests/test_e2e_hermetique.py tests/test_e2e_serveur.py tests/test_e2e_ia.py
      - name: Captures des pages en cas d'échec (mode salle)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-echecs-salle
          path: prototype/var/e2e_echecs_salle/
          if-no-files-found: ignore

  dependances:
    # Vulnérabilités connues des dépendances (base publique PyPA / OSV).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pip-audit
      - name: Aucune vulnérabilité connue (exécution + facultatives, versions exactes)
        run: pip-audit -r constraints.txt --progress-spinner off

  reproductibilite:
    # Rejoue tous les benchmarks du sprint : un chiffre publié ne peut pas diverger silencieusement du code.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: prototype
    env:
      HACKVS_SEMANTIQUE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dépendances
        run: pip install -r requirements-dev.txt -c constraints.txt
      - name: Navigateur pour les tests de bout en bout
        run: python -m playwright install --with-deps chromium
        timeout-minutes: 10              # un téléchargement bloqué échoue vite au lieu de geler la CI 6 h (run #157)
      - name: Bout en bout dans un vrai navigateur (scène, console Club Pulse, application mobile, action collective, pannes réseau, CSP)
        env:
          HACKVS_E2E_OBLIGATOIRE: "1"
        run: python -m pytest -q tests/test_e2e_scene.py tests/test_e2e_pulse.py tests/test_e2e_action.py tests/test_e2e_capacites.py tests/test_e2e_hermetique.py tests/test_e2e_serveur.py tests/test_e2e_ia.py
      - name: Captures des pages en cas d'échec de bout en bout
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-echecs
          path: prototype/var/e2e_echecs/
          if-no-files-found: ignore
      - name: Rejouer les benchmarks du sprint
        run: python scripts/reproduire_sprint.py
      - name: Les résultats publiés sont identiques à l'octet
        run: git diff --exit-code -- eval/
