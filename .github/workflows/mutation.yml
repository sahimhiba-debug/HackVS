name: Mutation (registre des capacités)

# Pas à chaque push (≈ 30–60 min de CPU) : à la demande, chaque nuit, quand le registre ou le banc changent, et sur tout tag de
# démonstration (demo-*). Avant de poser un tag de démo : `make mutation` en local doit être vert.
# RÈGLE D'EXPLOITATION : AUCUNE campagne de mutation sur la machine de démonstration pendant le hackathon (≈ 30 min de
# CPU à pleine charge) — elles tournent ici, la nuit et avant un tag, jamais sur l'ordinateur de la salle.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    # `tags` seul ne déclenche QUE sur les tags : sans `branches`, aucune poussée de branche ne lançait la campagne
    # (constaté : 0 exécution après des poussées qui touchaient capacites.py). Le filtre de chemins s'applique aux
    # poussées de branche ; un tag demo-* déclenche toujours.
    branches: ["**"]
    tags: ["demo-*"]
    paths:
      - "prototype/intelligence/capacites.py"
      - "prototype/intelligence/essai.py"
      - "prototype/tests/test_capacites*.py"
      - "prototype/tests/test_banc_finalite.py"
      - "prototype/setup.cfg"
      - "prototype/scripts/mutation_capacites.py"   # la porte elle-même (H3) : la changer relance une campagne
      - "docs/audit/mutants_survivants.txt"
      - ".github/workflows/mutation.yml"

permissions:
  contents: read

# Une seule campagne par branche : une nouvelle poussée annule la campagne en cours (elle mutait un code déjà dépassé).
# Vérification NON BLOQUANTE : aucune règle de protection de branche ne l'exige (branche non protégée, constaté le
# 2026-09-30) ; elle signale, elle n'empêche pas une fusion.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 330         # run #11 (01.10) coupé à 150 min : la sélection a grandi (tests F26, F31, F32, R3 sur le monde de démo) ; 330 < plafond GitHub 360
    defaults:
      run:
        working-directory: prototype
    env:
      HACKVS_SEMANTIQUE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dépendances
        run: pip install -r requirements-dev.txt -c constraints.txt && pip install mutmut==3.8.0
      - name: Campagne de mutation ; échec si un survivant n'est pas classé équivalent
        run: python scripts/mutation_capacites.py
