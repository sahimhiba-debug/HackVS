# Mutation testing (mutmut) — limité au REGISTRE DES CAPACITÉS (docs/audit/PIVOT_INSPECTION.md, Phase 1).
#   python -m mutmut run && python -m mutmut results
[mutmut]
source_paths=intelligence
only_mutate=intelligence/capacites.py
also_copy=
    app
    plateforme
    adaptateurs
    data
    prompts
    web
    eval
    scripts
    experiences
pytest_add_cli_args=-p no:cacheprovider -q
pytest_add_cli_args_test_selection=
    tests/test_capacites.py
    tests/test_capacites_oracle.py
    tests/test_banc_finalite.py
    tests/test_capacites_regles.py
    tests/test_capacites_retrait.py
    tests/test_capacites_hypotheses.py
    tests/test_asks_selection.py
    tests/test_pulse.py
    tests/test_vues_capacites.py
    tests/test_adaptation_profil.py
    tests/test_capacites_regles_phase2.py
    tests/test_reconsentement.py
    tests/test_budget_noeuds.py
    tests/test_budget_decision.py
    tests/test_capacites_regles_phase3.py
    tests/test_capacites_offre_ne_couvre_plus.py
    tests/test_provenance_ia.py
    tests/test_acquittement_faits_hors_monde.py

[tool:pytest]
# le dossier de travail de mutmut (copie du projet) n'est jamais collecté par la suite ordinaire
norecursedirs = mutants .* build dist var __pycache__ node_modules
