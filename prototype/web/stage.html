<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réseau vivant · scène</title>
  <meta name="description" content="Une histoire sur un réseau fictif : une nouvelle membre, son besoin, une introduction consentie, un suivi, une opportunité, un réseau qui change — et un système qui sait s'abstenir.">
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    body { background: var(--papier); }
    .scene { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 24px; padding: 20px 24px 96px; max-width: 1500px; margin: 0 auto; }
    .graphe { background: var(--surface); border: 1.5px solid var(--ligne); border-radius: var(--rayon); padding: 8px; position: sticky; top: 12px; align-self: start; }
    .graphe svg { width: 100%; height: auto; display: block; }
    .legende { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--encre-2); padding: 6px 8px 2px; }
    .legende span { display: inline-flex; align-items: center; gap: 6px; }
    .legende svg { width: 28px; height: 10px; }
    .lien { stroke: var(--encre-3); stroke-width: 1.6; opacity: .75; transition: opacity .4s; }
    .lien.intro { stroke: var(--rouge); stroke-width: 3.2; opacity: 1; }
    .lien.nouveau { stroke-dasharray: 400; stroke-dashoffset: 400; animation: trace 1.1s ease-out forwards; }
    .lien.simule { stroke: var(--rouge); stroke-width: 2.2; stroke-dasharray: 6 5; opacity: .9; }
    .lien.candidat { stroke: var(--encre-2); stroke-width: 2; stroke-dasharray: 2 5; }
    .lien.pont { stroke: var(--ambre); stroke-width: 4; opacity: 1; }
    .lien.planA { stroke: var(--vert); stroke-width: 3; stroke-dasharray: 7 5; opacity: 1; }
    .lien.planB { stroke: var(--rouge); stroke-width: 3; stroke-dasharray: 7 5; opacity: 1; }
    .lien.retire { stroke: var(--rouge-fonce); stroke-width: 3; stroke-dasharray: 2 6; opacity: 1; }
    .lien.inventee { stroke: var(--encre-3); stroke-width: 2.5; stroke-dasharray: 3 6; opacity: .9; }
    dialog#tour { max-width: 720px; width: calc(100% - 32px); border: 1.5px solid var(--ligne); border-radius: var(--rayon); background: var(--surface); color: var(--encre); padding: 20px 24px; }
    dialog#tour::backdrop { background: rgba(0,0,0,.35); }
    details.indic { border-top: 1.5px solid var(--ligne); padding: 8px 0; }
    details.indic summary { cursor: pointer; font-size: 17px; }
    .lien-zone { stroke: transparent; stroke-width: 16; cursor: pointer; }
    .noeud.coupe circle { fill: var(--rouge-pale); stroke: var(--rouge-fonce); stroke-dasharray: 3 3; }
    .acte { display: inline-flex; gap: 8px; align-items: center; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .acte b { background: var(--rouge); color: #fff; border-radius: 6px; padding: 2px 8px; }
    .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .col { border: 1.5px solid var(--ligne); border-radius: var(--rayon); padding: 10px 12px; }
    .col h3 { margin: 0 0 6px; font-size: 15px; }
    details.bloc summary { cursor: pointer; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--encre-2); font-weight: 700; }
    .col li, .col p { font-size: 14px; }
    .col.retenu { border: 2px solid var(--vert); }
    .plan { border: 2px solid var(--ligne); border-radius: var(--rayon); padding: 10px 12px; }
    .plan.A { border-color: var(--vert); } .plan.B { border-color: var(--rouge); }
    .chiffre { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .plan h3 { font-size: 17px; margin: 0 0 4px; } .plan p { margin: 2px 0; }
    @media (max-width: 900px) { .deux { grid-template-columns: 1fr; } }
    @keyframes trace { to { stroke-dashoffset: 0; } }
    .noeud circle { fill: var(--surface); stroke: var(--encre-2); stroke-width: 2; transition: r .3s; }
    .noeud.sophie circle { fill: var(--rouge); stroke: var(--rouge-fonce); }
    .noeud.focus circle { stroke: var(--rouge); stroke-width: 3.5; }
    .noeud text { font-size: 13px; fill: var(--encre); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; font-weight: 600; }
    .noeud.sophie text { font-weight: 800; }
    .carte-etape { background: var(--surface); border: 1.5px solid var(--ligne); border-radius: var(--rayon); padding: 22px 24px; min-height: 60vh; }
    .carte-etape .num { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--encre-2); font-weight: 700; }
    .carte-etape h1 { font-size: clamp(26px, 3vw, 40px); margin: 6px 0 8px; line-height: 1.1; }
    .dit { font-size: 19px; color: var(--encre-2); margin: 0 0 18px; }
    .bloc { border-top: 1.5px solid var(--ligne); padding-top: 12px; margin-top: 14px; }
    .bloc h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--encre-2); margin: 0 0 6px; }
    .bloc p, .bloc li { font-size: 15px; margin: 4px 0; }
    .bloc ul { margin: 0; padding-left: 18px; }
    q { font-style: italic; }
    .puce { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; background: var(--ambre-pale); color: var(--ambre); }
    .puce.ok { background: var(--vert-pale); color: var(--vert); }
    .puce.non { background: var(--rouge-pale); color: var(--rouge-fonce); }
    .cand { border: 1.5px solid var(--ligne); border-radius: var(--rayon); padding: 12px 14px; margin-top: 12px; }
    .cand.premier { border: 2px solid var(--rouge); }
    .cand h3 { margin: 0; font-size: 19px; }
    .cand .qui { font-size: 13px; color: var(--encre-2); margin: 0 0 6px; }
    .grille-kv { display: grid; grid-template-columns: 150px 1fr; gap: 4px 12px; font-size: 14px; }
    .grille-kv dt { color: var(--encre-2); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding-top: 2px; }
    .grille-kv dd { margin: 0; }
    .tuiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .tuile { border: 1.5px solid var(--ligne); border-radius: var(--rayon); padding: 10px 12px; }
    .tuile .lib { font-size: 12px; color: var(--encre-2); }
    .tuile .val { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .tuile .sous { font-size: 12px; color: var(--encre-2); font-variant-numeric: tabular-nums; }
    .frise { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
    .frise span { border: 1.5px solid var(--ligne); border-radius: 999px; padding: 3px 10px; }
    .frise span.der { border-color: var(--rouge); font-weight: 700; }
    .abst { border-left: 4px solid var(--ambre); padding: 8px 12px; background: var(--ambre-pale); border-radius: 0 var(--rayon) var(--rayon) 0; }
    .commandes { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1.5px solid var(--ligne);
      display: flex; align-items: center; gap: 10px; padding: 10px 24px; z-index: 5; flex-wrap: wrap; }
    .progres { display: flex; gap: 5px; flex: 1; min-width: 160px; }
    .progres i { height: 6px; flex: 1; background: var(--ligne); border-radius: 3px; }
    .progres i.fait { background: var(--rouge); }
    .horloge { font-size: 13px; color: var(--encre-2); font-variant-numeric: tabular-nums; }
    .note { font-size: 12px; color: var(--encre-3); }
    @media (max-width: 900px) {
      .scene { grid-template-columns: 1fr; padding: 12px 16px 120px; }
      .graphe { position: static; }
      .tuiles { grid-template-columns: 1fr 1fr; }
      .grille-kv { grid-template-columns: 1fr; }
      .commandes { padding: 8px 16px; gap: 6px; }
      .commandes .btn { width: auto; flex: 1 1 0; padding: 8px 6px; font-size: 14px; }
      .horloge { width: 100%; font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { .lien.nouveau { animation: none; stroke-dashoffset: 0; } }
  </style>
</head>
<body>
  <a class="skip" href="#principal">Aller au contenu</a>
  <main id="principal" class="scene">
    <section class="graphe" aria-label="Réseau du Club (fictif)">
      <svg id="svg" viewBox="0 0 1000 720" role="img" aria-labelledby="titre-graphe"><title id="titre-graphe">Graphe des relations du réseau de scène</title></svg>
      <div class="legende" aria-hidden="true">
        <span><svg viewBox="0 0 28 10"><line x1="0" y1="5" x2="28" y2="5" class="lien"/></svg>rencontre passée</span>
        <span><svg viewBox="0 0 28 10"><line x1="0" y1="5" x2="28" y2="5" class="lien intro"/></svg>relation née d'une introduction</span>
        <span><svg viewBox="0 0 28 10"><line x1="0" y1="5" x2="28" y2="5" class="lien planA"/></svg>introduction proposée (simulation)</span>
        <span><svg viewBox="0 0 28 10"><line x1="0" y1="5" x2="28" y2="5" class="lien inventee"/></svg>connexion refusée faute de preuve</span>
      </div>
      <p class="note" style="padding:0 8px 6px">Réseau de scène FICTIF. Vue de démonstration : en production, un membre ne voit que ses propres relations.</p>
    </section>
    <section class="carte-etape" id="carte" aria-live="polite"></section>
  </main>
  <nav class="commandes" aria-label="Commandes de la démonstration">
    <button class="btn petit" type="button" id="reinit" title="Réinitialiser (R)">⟲ Réinitialiser</button>
    <button class="btn petit" type="button" id="prec" title="Étape précédente (←)">← Précédent</button>
    <button class="btn primaire" type="button" id="suiv" title="Étape suivante (→ ou espace)">Suivant →</button>
    <button class="btn petit" type="button" id="rejouer" title="Rejouer toute la démonstration">Rejouer tout</button>
    <button class="btn petit" type="button" id="btn-tour" title="Vue de l'organisatrice (T)">Tour de contrôle</button>
    <div class="progres" id="progres" aria-hidden="true"></div>
    <span class="horloge" id="horloge"></span>
  </nav>
  <dialog id="tour" aria-labelledby="tour-titre">
    <h2 id="tour-titre">Tour de contrôle — que se passe-t-il dans le réseau ?</h2>
    <div id="tour-contenu"></div>
    <form method="dialog"><button class="btn petit">Fermer</button></form>
  </dialog>
  <script type="module">
    import { $, api, h, toast } from "/static/js/outils.js";
    let vue = null, occupe = false;
    const SOPHIE = "n01";
    const LIB_TYPES = { INTRO_DEMANDEE: "introduction demandée", INTRO_ACCEPTEE: "acceptée", RENCONTRE: "rencontre", RELANCE_ACCEPTEE: "relance acceptée",
      SUIVI: "suivi", RESULTAT: "affaire en cours" };
    const CHAPITRES = ["Nouveau membre", "Besoin", "Candidats", "Consentement", "Rencontre", "Suivi", "Opportunité", "Réseau", "Abstention", "Saturation", "Bilan"];
    const trace = (n) => vue.traces.find((t) => t.etape === n);
    const court = (nom) => { const [p, n] = (nom || "").split(" "); return n ? `${p} ${n[0]}.` : p; };
    let contrefactuel = null;                              // résultat d'un clic sur une relation

    function graphe() {
      const svg = $("#svg"), W = 1000, H = 720, M = 60;
      const xs = vue.noeuds.map((n) => n.x), ys = vue.noeuds.map((n) => n.y);
      const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
      const P = Object.fromEntries(vue.noeuds.map((n) => [n.id, [M + (n.x - x0) / (x1 - x0 || 1) * (W - 2 * M), M + (n.y - y0) / (y1 - y0 || 1) * (H - 2 * M)]]));
      const noms = Object.fromEntries(vue.noeuds.map((n) => [n.id, n.nom]));
      const ns = "http://www.w3.org/2000/svg";
      const el = (t, a) => { const e = document.createElementNS(ns, t); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); return e; };
      const avant = new Set([...svg.querySelectorAll("line[data-k]")].map((l) => l.dataset.k));
      [...svg.querySelectorAll("g, line")].forEach((x) => x.remove());
      const gl = el("g", {}), gn = el("g", {}), gz = el("g", {});
      const e = vue.etape - 1, focus = new Set(), coupes = new Set(), alerte = new Set();
      const cle = (a, b) => [a, b].sort().join("|");
      const retire = contrefactuel ? cle(...contrefactuel.paire) : null;
      if (contrefactuel) contrefactuel.coupes_de_leur_groupe.forEach((x) => coupes.add(x));
      const ligne = (a, b, cls, reel = false) => {
        if (!P[a] || !P[b]) return;
        const k = cle(a, b);
        const c = `lien ${cls}${retire === k ? " retire" : ""}${avant.has(k) || !cls.includes("intro") ? "" : " nouveau"}`;
        gl.append(el("line", { x1: P[a][0], y1: P[a][1], x2: P[b][0], y2: P[b][1], class: c, "data-k": k }));
        if (reel && e >= 7) {                              // zone de clic large : simuler la disparition de CETTE relation
          const z = el("line", { x1: P[a][0], y1: P[a][1], x2: P[b][0], y2: P[b][1], class: "lien-zone", tabindex: "0", role: "button",
            "aria-label": `Simuler la disparition de la relation ${noms[a]} – ${noms[b]}` });
          z.addEventListener("click", () => simulerPerte(a, b));
          z.addEventListener("keydown", (ev) => { if (ev.key === "Enter") simulerPerte(a, b); });
          gz.append(z);
        }
      };
      for (const l of vue.liens) ligne(l.a, l.b, l.types.includes("INTRO_ACCEPTEE") || l.types.includes("RENCONTRE") && (l.a === SOPHIE || l.b === SOPHIE) ? "intro" : "", true);
      const markus = trace(2)?.faits.candidats[0]?.id;
      if (e === 2) (trace(2)?.faits.candidats || []).forEach((c) => { ligne(SOPHIE, c.id, "candidat"); focus.add(c.id); });
      if (e >= 3 && e <= 6 && markus) focus.add(markus);
      if (e === 7) (trace(7)?.faits.paires || []).forEach(([a, b]) => { ligne(a, b, "planA"); focus.add(a); focus.add(b); });
      if (e === 8) {
        const f = trace(8).faits;
        alerte.add(f.membre_id);
        if (f.par_ressemblance) { ligne(f.membre_id, f.par_ressemblance.id, "inventee"); focus.add(f.par_ressemblance.id); }
      }
      for (const n of vue.noeuds) {
        if (!n.present) continue;
        const [x, y] = P[n.id];
        const g = el("g", { class: `noeud${n.id === SOPHIE ? " sophie" : ""}${focus.has(n.id) ? " focus" : ""}${coupes.has(n.id) || alerte.has(n.id) ? " coupe" : ""}` });
        g.append(el("circle", { cx: x, cy: y, r: n.id === SOPHIE ? 13 : focus.has(n.id) || alerte.has(n.id) ? 11 : 8 }));
        // étiquette côté intérieur (jamais coupée au bord), ou dessous si les deux côtés sont occupés
        const proche = (sens) => vue.noeuds.some((m) => m.present && m.id !== n.id && Math.abs(P[m.id][1] - y) < 16
          && sens * (P[m.id][0] - x) > 0 && sens * (P[m.id][0] - x) < 170);
        const gauche = x > W * 0.72 || proche(1), dessous = gauche && proche(-1);
        const t = el("text", dessous ? { x, y: y + 26, "text-anchor": "middle" } : { x: gauche ? x - 14 : x + 14, y: y + 4, "text-anchor": gauche ? "end" : "start" });
        t.textContent = court(noms[n.id]); g.append(t);
        gn.append(g);
      }
      svg.append(gl, gz, gn);
    }

    async function simulerPerte(a, b) {
      try { contrefactuel = await api(`/api/stage/sans_relation?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}`); rendre(); }
      catch (err) { toast(err.message, "erreur"); }
    }

    const bloc = (titre, ...enfants) => h("div", { class: "bloc" }, h("h2", {}, titre), ...enfants);
    const details = (titre, ...enfants) => h("details", { class: "bloc" }, h("summary", {}, titre), ...enfants);
    const tuile = (lib, val, sous) => h("div", { class: "tuile" }, h("div", { class: "lib" }, lib), h("div", { class: "val" }, String(val)), sous ? h("div", { class: "sous" }, sous) : null);
    const puce = (txt, cls = "") => h("span", { class: `puce ${cls}` }, txt);
    const frise = (types) => h("div", { class: "frise" }, types.map((t, i) => h("span", { class: i === types.length - 1 ? "der" : "" }, LIB_TYPES[t] || t)));
    const avantApres = (lib, a, b, mieux) => tuile(lib, `${a} → ${b}`, a === b ? "inchangé" : (mieux(a, b) ? "mieux" : "moins bien"));

    function candidat(c) {
      const d = c.dimensions;
      return h("article", { class: "cand premier" },
        h("h3", {}, c.nom, " ", puce(c.niveau === "forte" ? "correspondance forte" : "partielle · à vérifier", c.niveau === "forte" ? "ok" : "")),
        h("p", { class: "qui" }, c.entreprise),
        h("dl", { class: "grille-kv" },
          h("dt", {}, "Pourquoi lui"), h("dd", {}, h("q", {}, c.preuves[0].extrait), " ", puce(c.preuves[0].nature === "declare" ? "déclaré" : "déduit", "ok")),
          h("dt", {}, "Et pour lui ?"), h("dd", {}, d.reciprocite.etablie ? [puce("réciprocité prouvée", "ok"), ` il cherche « ${d.reciprocite.son_besoin.split(" : ").pop()} »`] : puce("non établie")),
          h("dt", {}, "Inconnu"), h("dd", {}, d.inconnu.join(" · "))));
    }

    function perte(f) {
      return bloc(`Votre simulation : si la relation ${f.noms.join(" – ")} disparaît`,
        h("div", { class: "tuiles" }, tuile("groupes", f.apres.groupes, `avant ${f.avant.groupes}`),
          tuile("coupés de leur groupe", f.coupes_de_leur_groupe.length, `sur ${f.taille_du_groupe}`),
          tuile("groupe robuste", f.apres.groupe_robuste, `avant ${f.avant.groupe_robuste}`)),
        h("p", {}, f.coupes_noms.length ? `Coupés : ${f.coupes_noms.join(", ")}.` : "Personne n'est coupé : cette relation est doublée par un autre chemin."),
        h("p", { class: "note" }, puce("SIMULATION"), " calcul sur le graphe actuel ; rien n'est écrit."));
    }

    const RENDUS = {
      0: (f) => [bloc("Sa phrase", h("p", {}, h("q", {}, f.description))),
        h("div", { class: "deux" }, h("div", { class: "col" }, h("h3", {}, "Le système propose"), h("ul", {}, f.propose.map((x) => h("li", {}, x)))),
          h("div", { class: "col retenu" }, h("h3", {}, "Sophie valide"), h("ul", {}, f.valide.map((x) => h("li", {}, x))))),
        h("p", {}, puce("invisible par défaut", "ok"), " — c'est elle qui choisit d'être recommandée. Aucune coordonnée enregistrée.")],
      1: (f) => [bloc("Ce que le moteur a compris", h("ul", {}, f.compris.map((c) => h("li", {}, h("strong", {}, `${c.role} : `), c.quoi,
          c.extrait ? [" ← ", h("q", {}, c.extrait)] : "", c.note ? h("span", { class: "note" }, ` (${c.note})`) : "")))),
        f.incertain.length ? bloc("Incertain", h("p", {}, f.incertain.join(" · "))) : null,
        h("p", { class: "note" }, f.analyse, ". Chaque critère cite la phrase ; ce qui reste ambigu est demandé, jamais deviné.")],
      2: (f) => [h("p", {}, `${f.examines} membres examinés → ${f.candidats.length} proposition(s).`), candidat(f.candidats[0]),
        f.candidats.length > 1 ? details(`${f.candidats.length - 1} autre(s), plus faible(s)`, h("ul", {}, f.candidats.slice(1).map((c) => h("li", {}, `${c.nom} — ${c.niveau}`)))) : null,
        h("p", { class: "note" }, "Qui refuse d'être sollicité n'est ni nommé, ni proposé, ni compté.")],
      3: (f) => [h("dl", { class: "grille-kv" },
          h("dt", {}, "Sa boîte"), h("dd", {}, `${f.introductions_a_repondre_pour_lui} demande d'introduction — il peut refuser`),
          h("dt", {}, "Coordonnées"), h("dd", {}, puce("cachées avant son accord", "non"), " → ", puce("partagées après", "ok")))],
      4: (f) => [bloc("La relation garde son histoire", frise(f.ligne_de_temps)), h("p", { class: "note" }, `Rencontre enregistrée le ${f.quand}.`)],
      5: (f) => [...f.relances.map((p) => bloc(`Une raison de se reparler — ${p.paire.join(" ↔ ")}`,
          ...p.raisons.map((r) => h("div", {}, h("p", {}, h("strong", {}, `Pour ${r.pour} : `), r.message),
            details("Preuves", h("ul", {}, r.preuves.map((x) => h("li", {}, `${x.quoi} : `, h("q", {}, x.extrait))))))))),
        h("div", { class: "tuiles" }, tuile("relance", f.relances.reduce((s, p) => s + p.raisons.length, 0), "raison prouvée"),
          tuile("silences", f.silences.rien_de_nouveau, "rien de nouveau"))],
      6: (f) => [bloc("Ligne de temps", frise(f.ligne_de_temps)), h("p", {}, "État : ", h("strong", {}, f.libelle), "."),
        h("p", { class: "note" }, "Relation ≠ opportunité ≠ résultat : chaque étape est un fait déclaré, jamais une supposition.")],
      7: (f) => f.plan === null ? [bloc("Ne rien faire", h("p", {}, "Aucune action fondée sur une preuve."))] : [
        h("div", { class: "tuiles" },
          avantApres("groupes séparés", f.avant.groupes, f.apres.groupes, (a, b) => b < a),
          avantApres("plus grand groupe", f.avant.plus_grand_groupe, f.apres.plus_grand_groupe, (a, b) => b > a),
          avantApres("groupe robuste", f.avant.groupe_robuste, f.apres.groupe_robuste, (a, b) => b > a)),
        h("div", { class: "tuiles" }, tuile("besoins couverts", f.besoins_couverts, `${f.membres_servis} membres servis`),
          tuile("réciproques", `${f.reciproques} / ${f.introductions.length}`, "aide dans les deux sens"),
          avantApres("isolés", f.avant.isoles, f.apres.isoles, (a, b) => b < a)),
        h("p", {}, "Introductions : ", f.introductions.map((i) => i.qui.join(" – ")).join(" · "), "."),
        h("p", { class: "note" }, puce("SIMULATION"), ` ${f.nature.replace(/^SIMULATION\s*:\s*/, "")}. Groupe robuste : ${f.lexique.replace(/^robuste = /, "")}. Cliquez une relation du graphe pour simuler sa disparition.`)],
      8: (f) => [h("div", { class: "tuiles" }, tuile("introductions possibles", f.introductions_possibles, "consentement respecté"),
          tuile("fondées sur une preuve", f.introductions_fondees, "aide prouvée"),
          tuile("décision", f.decision === "S_ABSTENIR" ? "Abstention" : "Proposer", "")),
        f.par_ressemblance ? h("p", {}, `Un moteur « par ressemblance » proposerait ${f.par_ressemblance.nom} (ressemblance ${f.par_ressemblance.ressemblance}) — trait gris sur le graphe. Mais ressembler n'est pas aider.`) : null,
        h("div", { class: "abst" }, h("strong", {}, "Raison objective : "), Object.entries(f.raisons).map(([r, n]) => `${r} (${n})`).join(" ; "), "."),
        h("p", { class: "note" }, `Ce qui changerait la décision : ${f.ce_qui_changerait}. Même règle pour Sophie : « ${f.japon.demande} » → ${f.japon.decision === "S_ABSTENIR" ? "abstention" : "proposition"}.`)],
      9: (f) => [h("div", { class: "tuiles" }, ...f.soirees.map((s) => tuile(`soirée ${s.soiree}`, s.decision === "S_ABSTENIR" ? "—" : s.tables,
          s.decision === "S_ABSTENIR" ? "abstention" : `rencontres utiles (${s.membres_servis} membres servis)`))),
        f.raison ? h("div", { class: "abst" }, h("strong", {}, "Soirée " + f.soirees[f.soirees.length - 1].soiree + " : abstention. "), f.raison, ".") : null,
        h("p", { class: "note" }, puce("SIMULATION"), ` ${f.nature.replace(/^SIMULATION\s*/, "")}. Mêmes membres, même moteur ; seules les rencontres déjà faites sont exclues.`)],
      10: (f) => [h("dl", { class: "grille-kv" }, ...f.natures.flatMap((n) => [h("dt", {}, n.nature), h("dd", {}, n.quoi)])),
        h("p", { class: "note" }, `${f.faits_enregistres} faits enregistrés dans ce réseau fictif au ${f.le}.`)],
    };

    function carte() {
      const e = vue.etape - 1;
      $("#horloge").textContent = `Date simulée : ${vue.le} · étape ${vue.etape}/${vue.total}`;
      $("#progres").replaceChildren(...Array.from({ length: vue.total }, (_, i) => h("i", { class: i < vue.etape ? "fait" : "", title: CHAPITRES[i] })));
      $("#prec").disabled = vue.etape === 0; $("#suiv").disabled = vue.etape >= vue.total;
      if (e < 0) {
        $("#carte").replaceChildren(h("p", { class: "num" }, "Réseau vivant · démonstration"),
          h("h1", {}, "La Foire crée des rencontres. Que deviennent-elles quand elle se termine ?"),
          h("p", { class: "dit" }, "Un réseau fictif de 16 membres, en deux îlots. Une nouvelle membre, Sophie. Tout est calculé en direct."),
          h("p", { class: "note" }, vue.avertissement));
        return;
      }
      const t = trace(e);
      $("#carte").replaceChildren(h("p", { class: "acte" }, h("b", {}, String(e + 1)), CHAPITRES[e], ` · ${t.le}`),
        h("h1", {}, t.titre), h("p", { class: "dit" }, t.dit), ...(contrefactuel && e >= 7 ? [perte(contrefactuel)] : []), ...(RENDUS[e]?.(t.faits) || []).filter(Boolean));
    }

    async function ouvrirTour() {
      try {
        const r = await api("/api/stage/tour");
        $("#tour-contenu").replaceChildren(h("p", { class: "note" }, `Au ${r.le} · données FICTIVES · cliquez un chiffre pour voir ce qu'il compte.`),
          ...r.indicateurs.map((i) => h("details", { class: "indic" }, h("summary", {}, h("span", { class: "chiffre" }, String(i.valeur)), " ", i.libelle),
            h("p", { class: "note" }, "Définition : ", i.definition), i.elements.length ? h("ul", {}, i.elements.map((x) => h("li", {}, x))) : h("p", { class: "note" }, "(aucun)"))));
        $("#tour").showModal();
      } catch (err) { toast(err.message, "erreur"); }
    }

    function rendre() { graphe(); carte(); }
    async function appel(chemin) {
      if (occupe) return;                                   // double clic : une seule action en vol
      occupe = true;
      try { vue = await api(chemin, { methode: "POST" }); contrefactuel = null; rendre(); }
      catch (e) { toast(e.message, "erreur"); }
      finally { occupe = false; }
    }
    $("#suiv").addEventListener("click", () => appel("/api/stage/suivant"));
    $("#prec").addEventListener("click", () => appel(`/api/stage/aller/${Math.max(0, vue.etape - 1)}`));
    $("#reinit").addEventListener("click", () => appel("/api/stage/reinitialiser"));
    $("#rejouer").addEventListener("click", () => appel(`/api/stage/aller/${vue.total}`));
    $("#btn-tour").addEventListener("click", ouvrirTour);
    document.addEventListener("keydown", (ev) => {
      if (ev.target.closest("input, textarea, select")) return;
      if (ev.key === "ArrowRight" || ev.key === " ") { ev.preventDefault(); if (vue.etape < vue.total) appel("/api/stage/suivant"); }
      if (ev.key === "ArrowLeft" && vue.etape > 0) appel(`/api/stage/aller/${vue.etape - 1}`);
      if (ev.key === "r" || ev.key === "R") appel("/api/stage/reinitialiser");
      if (ev.key === "t" || ev.key === "T") ouvrirTour();
    });
    api("/api/stage").then((v) => { vue = v; rendre(); }).catch((e) => toast(e.message, "erreur"));
  </script>
</body>
</html>
