<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Le Fil du Club</title>
  <meta name="description" content="Prototype exploratoire : un besoin de membre devient une occasion d'aider pour un autre membre du Club.">
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <a class="skip" href="#principal">Aller au contenu</a>
  <header class="barre">
    <div class="marque"><span class="logo" aria-hidden="true"></span><span>Le Fil du Club</span></div>
    <div class="badges" id="badges" aria-live="polite"></div>
    <div class="persona" id="persona" hidden>
      <label class="etiquette" for="choix-membre">Vous incarnez (démo)</label>
      <select id="choix-membre" aria-label="Membre incarné (démonstration)"></select>
    </div>
  </header>
  <div class="bandeau-demo" id="bandeau-demo" hidden>
    Démonstration · personnes et entreprises <strong>fictives</strong> · aucun message n'est envoyé
  </div>

  <nav class="onglets" role="tablist" aria-label="Sections">
    <button class="onglet" role="tab" id="tab-nouveau" data-vue="nouveau" aria-controls="vue-nouveau">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nouveau besoin</button>
    <button class="onglet" role="tab" id="tab-besoins" data-vue="besoins" aria-controls="vue-besoins">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Mes besoins<span class="compteur" data-compteur="besoins" hidden></span></button>
    <button class="onglet" role="tab" id="tab-bourse" data-vue="bourse" aria-controls="vue-bourse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12h6l3-7 3 14 3-7h3"/></svg>Bourse<span class="compteur" data-compteur="bourse" hidden></span></button>
    <button class="onglet" role="tab" id="tab-suivi" data-vue="suivi" aria-controls="vue-suivi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="6" cy="12" r="2"/><circle cx="18" cy="12" r="2"/><path d="M8 12h8"/></svg>Suivi<span class="compteur" data-compteur="suivi" hidden></span></button>
    <button class="onglet" role="tab" id="tab-profil" data-vue="profil" aria-controls="vue-profil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profil</button>
  </nav>

  <main id="principal">
    <section class="vue" id="vue-nouveau" role="tabpanel" aria-labelledby="tab-nouveau" hidden></section>
    <section class="vue" id="vue-besoins" role="tabpanel" aria-labelledby="tab-besoins" hidden></section>
    <section class="vue" id="vue-bourse" role="tabpanel" aria-labelledby="tab-bourse" hidden></section>
    <section class="vue" id="vue-suivi" role="tabpanel" aria-labelledby="tab-suivi" hidden></section>
    <section class="vue" id="vue-profil" role="tabpanel" aria-labelledby="tab-profil" hidden></section>
  </main>

  <dialog id="dialogue" aria-labelledby="dialogue-titre">
    <form method="dialog" class="contenu" id="dialogue-form">
      <h2 id="dialogue-titre"></h2>
      <p class="consentement" id="dialogue-consentement"></p>
      <label class="titre" for="message">Votre message (modifiable)</label>
      <textarea id="message" rows="10"></textarea>
      <div class="actions">
        <button class="btn primaire" id="dialogue-envoyer" value="envoyer">Envoyer</button>
        <button class="btn" value="annuler" formnovalidate>Annuler</button>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <footer class="pied" id="pied"></footer>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
