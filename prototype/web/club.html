<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vue du Club · Le Fil du Club</title>
  <meta name="description" content="Ce que la communauté produit, et ce qui lui manque : indicateurs calculés, compétences à recruter.">
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
    .kpi { background: var(--surface); border: 1.5px solid var(--ligne); border-radius: var(--rayon); padding: 16px 18px; }
    .kpi .chiffre { font-size: clamp(34px, 4.4vw, 52px); font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
    .kpi .chiffre small { font-size: .45em; color: var(--encre-2); font-weight: 600; letter-spacing: 0; }
    .kpi p { margin: 8px 0 0; color: var(--encre-2); font-size: 15px; }
    .recruter { display: grid; gap: 12px; }
    .manque { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 18px; align-items: center; background: var(--surface);
      border: 2px solid var(--encre); border-radius: var(--rayon); padding: 16px 20px; animation: entre .35s ease-out both; }
    .manque:first-child { border-color: var(--rouge); box-shadow: 0 0 0 4px var(--rouge-pale); }
    .manque .n { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; color: var(--rouge); min-width: 1.4em; text-align: center; }
    .manque .quoi { font-size: clamp(20px, 2.4vw, 26px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
    .manque .detail { color: var(--encre-2); font-size: 14px; grid-column: 2 / 3; }
    .manque .action { grid-row: 1 / 3; grid-column: 3; }
    .dormantes { display: flex; flex-wrap: wrap; gap: 8px; }
    .dormantes span { border: 1.5px solid var(--ligne); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 15px; }
    .comble { background: var(--vert-pale); color: var(--vert); border: 2px solid var(--vert); border-radius: var(--rayon); padding: 12px 18px; margin: 0 0 20px; font-size: 18px; animation: entre .4s ease-out both; }
    .comble p { margin: 0; }
    .deux { display: grid; grid-template-columns: 1.4fr 1fr; gap: 32px; }
    @media (max-width: 820px) { .deux { grid-template-columns: 1fr; } .manque { grid-template-columns: auto 1fr; } .manque .action { grid-row: auto; grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <a class="skip" href="#principal">Aller au contenu</a>
  <header class="barre">
    <div class="marque"><span class="logo" aria-hidden="true"></span><span>Le Fil du Club · vue du Club</span></div>
    <div class="badges"><span class="badge demo">Démo · données fictives</span></div>
    <div class="barre-actions">
      <button class="btn petit" type="button" id="historique">Charger l'historique fictif</button>
      <a class="btn petit" href="/">Espace membre</a>
    </div>
  </header>
  <div class="bandeau-demo" role="region" aria-label="Avertissement">Indicateurs <strong>calculés en direct</strong> sur les données de démonstration (fictives) · aucun nom affiché</div>
  <main id="principal">
    <section class="vue">
      <p class="surtitre">Pour l'animation du Club</p>
      <h1 style="font-size:clamp(32px,4.6vw,60px)">Ce que le Club produit,<br>et ce qui lui manque.</h1>
      <div id="contenu" aria-live="polite"><div class="squelette"></div></div>
    </section>
  </main>
  <div class="toasts" role="region" aria-label="Notifications"><div role="status" aria-live="polite" id="toasts-live"></div></div>
  <script type="module" src="/static/js/club.js"></script>
</body>
</html>
