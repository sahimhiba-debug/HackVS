<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Club Pulse · Régie</title>
  <meta name="description" content="Club Pulse — régie de démonstration : l'écran commun et deux téléphones réels côte à côte. Démonstration seulement.">
  <link rel="icon" href="/static/pulse/icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/pulse/pulse.css">
  <style>
    body { background: #1c1c1a; color: #f1f0ea; overflow: hidden; }
    .scene { display: grid; grid-template-columns: 1248px 304px 304px; gap: 14px; padding: 14px; height: 900px; width: 1920px; }
    .scene > div { min-width: 0; }
    .cadre { position: relative; overflow: hidden; border-radius: 12px; background: #fff; }
    .cadre.projection { height: 702px; width: 1248px; }
    .cadre.projection iframe { width: 1920px; height: 1080px; transform: scale(.65); transform-origin: 0 0; border: 0; }
    .cadre.telephone { height: 690px; width: 304px; border: 6px solid #3a3a37; border-radius: 26px; }
    .cadre.telephone iframe { width: 390px; height: 868px; transform: scale(.7487); transform-origin: 0 0; border: 0; }
    .etiquette { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #c2c0b8; margin: 0 0 6px 2px; }
    .legende { position: absolute; left: 14px; right: 14px; bottom: 14px; min-height: 150px; background: #10100f; border: 1px solid #45433f; border-radius: 12px;
      padding: 14px 18px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; }
    .legende b { font-size: 26px; letter-spacing: -0.02em; }
    .legende p { font-size: 19px; margin-top: 6px; color: #e5e3dc; }
    .legende .meta { font-size: 13px; color: #97958d; text-align: right; }
    .joue { display: inline-block; font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: #33270e; color: #f0bf5a; margin-left: 8px; vertical-align: middle; }
  </style>
</head>
<body>
  <div class="scene">
    <div><p class="etiquette">Écran commun (projection)</p><div class="cadre projection"><iframe id="projection" title="Écran commun"></iframe></div></div>
    <div><p class="etiquette">Téléphone 1 · Sophie (porteuse)</p><div class="cadre telephone"><iframe id="tel1" title="Téléphone de Sophie"></iframe></div></div>
    <div><p class="etiquette">Téléphone 2 · Léa (voix allemande)</p><div class="cadre telephone"><iframe id="tel2" title="Téléphone de Léa"></iframe></div></div>
  </div>
  <div class="legende">
    <div><b id="titre">Préparation</b><span id="joue" class="joue" hidden>joué</span><p id="texte">Nouvelle démonstration : offres préparées (fictives), aucune demande.</p></div>
    <div class="meta" id="meta">ENREGISTREMENT d'une exécution réelle<br>monde de démonstration FICTIF</div>
  </div>
  <script type="module">
    import { consoleFetch } from "/static/pulse/jeton-console.js";
    const $ = (s) => document.querySelector(s);
    const params = new URLSearchParams(location.search);
    $("#meta").textContent = "";
    for (const t of ["ENREGISTREMENT d'une exécution réelle, sans montage", "monde de démonstration FICTIF · horloge simulée",
                     `commit ${params.get("commit") || "non indiqué"}`]) { $("#meta").append(document.createTextNode(t), document.createElement("br")); }
    window.legende = (titre, texte, joue) => { $("#titre").textContent = titre; $("#texte").textContent = texte; $("#joue").hidden = !joue; };
    const r = await consoleFetch("/api/pulse/console/personas");
    const per = Object.fromEntries((await r.json()).map((p) => [p.id, p]));
    $("#projection").src = "/projection";
    let s1 = per.n01.session;
    if (!s1) {                                          // Sophie active son compte (aucun code n'est affiché à l'écran)
      const a = await fetch("/api/pulse/acces", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: per.n01.code }) });
      s1 = (await a.json()).session;
    }
    $("#tel1").src = `/app?session=${encodeURIComponent(s1)}#actions`;
    $("#tel2").src = `/app?session=${encodeURIComponent(per.d01.session)}#actions`;
    window.pret = true;
  </script>
</body>
</html>
