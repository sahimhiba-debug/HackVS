<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Club Pulse · Établi</title>
  <meta name="description" content="Club Pulse — l'établi : ce que le Club peut faire ensemble, et la pièce qui lui manque. Des rôles, jamais des noms. Monde de démonstration fictif.">
  <link rel="icon" href="/static/pulse/icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/pulse/pulse.css">
  <style>
    body { background: var(--papier); }
    header.haut { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-height: 58px; padding: 10px 32px; border-bottom: 1px solid var(--hairline-2); background: var(--card); }
    header.haut .droite { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .page { max-width: 1500px; margin: 0 auto; padding: 18px 24px 40px; }
    h1.titre { font-size: clamp(24px, 2.2vw, 34px); font-weight: 800; letter-spacing: -0.03em; }
    .sous { color: var(--secondary); margin-top: 6px; font-size: 15px; font-weight: 500; }
    .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 430px), 1fr)); gap: 18px; margin-top: 18px; }
    .capacite { background: var(--card); border: 2px solid transparent; border-radius: var(--r-card); padding: 14px 20px; cursor: pointer; box-shadow: var(--sh-card); transition: border-color .5s ease; }
    .capacite:hover { background: var(--hover); }
    .capacite:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .capacite[data-statut="ACTIVE"] { border-color: var(--green); }
    .capacite[data-statut="DEGRADED"] { border-color: var(--border-btn); }
    .capacite h2 { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.25; }
    .quand { font-size: 12px; font-weight: 600; color: var(--secondary); margin-top: 4px; font-variant-numeric: tabular-nums; }
    .pieces { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .piece { flex: 1 1 120px; min-height: 86px; border-radius: var(--r-tile); padding: 10px 12px; background: var(--card-sub); border: 1px solid var(--hairline); color: var(--ink); transition: background .6s ease, border-color .6s ease; }
    .piece b { display: block; font-size: 13.5px; font-weight: 700; } .piece small { display: block; font-size: 11px; font-weight: 500; color: var(--secondary); margin-top: 4px; }
    .piece.consentie { background: var(--card); border-color: var(--hairline); }
    .piece.consentie b::after { content: ""; display: inline-block; vertical-align: -2px; width: 14px; height: 14px; margin-left: 6px; background: var(--medaillon-ok) center / contain no-repeat; }
    .piece.critique { background: var(--brand-tint-2); border: 1px dashed var(--brand-dash); }
    .piece.critique small { color: var(--brand); font-weight: 700; }
    .piece.vide { background: var(--brand-tint-2); border: 1px dashed var(--brand-dash); color: var(--brand); }
    .piece.vide small { color: var(--brand-muted); }
    .piece.vide .demande { font-size: 12.5px; font-weight: 600; line-height: 1.45; color: var(--ink); margin-top: 6px; }
    .chip { font-size: 11px; font-weight: 800; padding: 4px 11px; border-radius: var(--r-pill); background: var(--chip-neutral); color: var(--secondary); white-space: nowrap; }
    .chip.vert { background: var(--green); color: #FFFFFF; }
    .chip.rouge { background: var(--brand-tint); color: var(--brand); }
    .chip.ambre { background: var(--chip-neutral); color: var(--secondary); }
    .chip.ambre::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--amber); }
    .chip.bleu { background: var(--chip-neutral); color: var(--ink-2); }
    .perdu { margin-top: 10px; color: var(--secondary); font-size: 13px; font-weight: 600; }
    .attention { margin-top: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .attention div { background: var(--card); border-radius: var(--r-card); padding: 13px 16px; font-size: 13px; box-shadow: var(--sh-card-light); }
    .attention ul, .passeport ul { margin: 6px 0 0; padding-left: 20px; }
    .attention .file { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .passeport { margin-top: 20px; background: var(--card); border-radius: var(--r-sheet); padding: 15px 24px; box-shadow: var(--sh-sheet); }
    .passeport h2 { font-size: 17px; letter-spacing: -0.015em; } .passeport h3 { font-size: 13px; margin-top: 12px; }
    .pulse { margin-top: 20px; }
    @media (max-width: 760px) { .attention { grid-template-columns: 1fr; } .page { padding: 14px 16px 30px; } }
  </style>
</head>
<body>
  <header class="haut">
    <span class="marque"><span class="pouls-point" aria-hidden="true"></span>Club Pulse · Établi</span>
    <span class="puce fictif">monde fictif</span>
    <span class="droite"><span class="puce" id="ia" data-role="ia">IA…</span>
      <button class="btn discret petit" id="ia-bascule">…</button><span class="puce" id="date">date…</span><span class="puce" id="fraicheur">…</span>
      <button class="btn discret petit" id="voir-pulse">Ce qui a changé</button>
      <button class="btn discret petit" id="qr-jure">QR juré</button></span>
  </header>
  <div class="page">
    <h1 class="titre">Ce que le Club peut faire ensemble</h1>
    <p class="sous">Chaque capacité est un assemblage de pièces déclarées par des membres, valables à sa date et consenties pour elle. La pièce manquante porte la demande.</p>
    <div class="attention" id="attention"></div>
    <div class="grille" id="grille"></div>
    <div id="passeport"></div>
    <div id="pulse" class="pulse"></div>
    <div id="jure"></div>
  </div>
  <script type="module">
    const $ = (s) => document.querySelector(s);
    function h(tag, attrs = {}, ...enfants) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v === null || v === undefined || v === false) continue;
        if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? "" : v);
      }
      for (const e of enfants.flat(Infinity)) if (e !== null && e !== undefined && e !== false) el.append(e instanceof Node ? e : document.createTextNode(String(e)));
      return el;
    }
    const jeton = () => { try { return sessionStorage.getItem("console-jeton") || "1"; } catch { return "1"; } };
    const JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
    const jour = (iso) => { const d = new Date(iso + "T12:00:00"); return `${JOURS[d.getDay()]} ${iso.slice(8, 10)}.${iso.slice(5, 7)}`; };
    const COULEURS = { ACTIVE: "vert", DEGRADED: "rouge", ONE_AWAY: "ambre", CONSENTED: "bleu", PROPOSED: "bleu", EXTINCT: "" };
    let choisie = null, derniere = null;

    function piece(p, c) {
      if (!p.presente) {
        return h("div", { class: "piece vide", "data-piece": p.emplacement }, h("b", {}, p.role), h("small", {}, p.libelle),
          c.ask ? h("p", { class: "demande" }, c.ask.texte) : null,
          c.ask ? h("small", {}, `Débloquerait ${c.ask.levier} capacité${c.ask.levier > 1 ? "s" : ""} · demande valable jusqu'au ${jour(c.ask.expire)}`) : null);
      }
      return h("div", { class: "piece" + (p.consentement === "donné" ? " consentie" : "") + (p.critique ? " critique" : ""), "data-piece": p.emplacement },
        h("b", {}, p.role), h("small", {}, p.libelle), h("small", {}, p.consentement === "donné" ? "✓ consentie pour cette capacité" : "consentement à demander"),
        p.critique ? h("small", {}, "pièce critique : aucune autre ne la remplace") : null);
    }
    function carte(c) {
      const el = h("article", { class: "capacite", "data-statut": c.statut, "data-finalite": c.finalite, tabindex: 0, role: "button",
        onclick: () => { choisie = c.finalite; rendre(derniere); $("#passeport").scrollIntoView({ behavior: "smooth" }); } },
        h("div", { style: "display:flex;justify-content:space-between;gap:10px;align-items:flex-start" }, h("h2", {}, c.titre),
          h("span", { class: "chip " + (COULEURS[c.statut] || (c.recherche_bornee ? "ambre" : "")), "data-role": "statut" }, c.statut_libelle)),
        h("p", { class: "quand" }, `${jour(c.jour)} · fenêtre ${c.fenetre}${c.creneau ? " · créneau " + c.creneau : ""}`),
        h("div", { class: "pieces" }, c.pieces.map((p) => piece(p, c))),
        c.perdus.map((x) => h("p", { class: "perdu" }, x)),
        c.recomposition ? h("p", { class: "quand" }, "Recomposition proposée : " + c.recomposition.texte) : null,
        c.sans_solution ? h("p", { class: "perdu" }, "Aucune solution sûre aujourd'hui.") : null,
        c.recherche_bornee ? h("p", { class: "perdu", "data-role": "bornee" }, "Recherche bornée atteinte : une composition a pu échapper au calcul (absence non garantie).") : null);
      return el;
    }
    function passeport(c) {
      const liste = (titre, items) => [h("h3", {}, titre), items.length ? h("ul", {}, items.map((x) => h("li", {}, x))) : h("p", { class: "note" }, "—")];
      return h("section", { class: "passeport", "aria-label": "Passeport de capacité" },
        h("span", { class: "surtitre" }, "Passeport de capacité"), h("h2", {}, c.titre),
        h("p", { class: "quand" }, `${jour(c.jour)} · ${c.fenetre} · ${c.statut_libelle} · version ${c.version} du patron`),
        ...liste("Pièces et consentements", c.pieces.map((p) => `${p.role} — ${p.libelle} : ${p.presente ? `fournie par ${p.fournie_par}, consentement ${p.consentement}` : "manquante"}`)),
        ...liste("Pièces critiques (calculé : sans elles, la capacité ne tient plus)", c.critiques),
        ...liste("Hypothèses restantes", c.hypotheses),
        ...liste("Ce qui ne vaut plus", c.perdus),
        ...liste("Alternatives", c.recomposition ? [c.recomposition.texte] : []),
        ...(c.sans_solution ? liste("Aucune solution sûre — ce qu'on sait, ce qu'on ignore, ce qui débloquerait",
          [...c.sans_solution.cause, ...c.sans_solution.sait, ...c.sans_solution.ignore, ...c.sans_solution.debloquerait.map((x) => "débloquerait : " + x)]) : []),
        ...liste("Résultats passés", [c.resultats]),
        h("h3", {}, "Récit (chaque phrase cite ses faits)"), h("div", { id: "recit" }, recits[c.finalite] ? recit(recits[c.finalite]) : h("p", { class: "note" }, "—")),
        h("button", { class: "btn discret petit", id: "rediger-recit", onclick: () => rediger(c.finalite) }, "Rédiger le récit"),
        h("p", { class: "note", style: "margin-top:10px" }, "Chaque personne peut retirer son consentement depuis son téléphone ; la capacité est alors recalculée. Aucun nom n'est affiché ici."));
    }
    function rendre(r) {
      if (!r) return;
      $("#date").textContent = `date du Club (simulée) : ${jour(r.date)}`;
      const a = r.attention;
      $("#attention").replaceChildren(
        h("div", {}, h("span", { class: "surtitre" }, "Bloque"), a.bloque.length ? h("ul", {}, a.bloque.map((x) => h("li", {}, x))) : h("p", { class: "note" }, "Rien.")),
        h("div", {}, h("span", { class: "surtitre" }, "Attend une décision"), a.decision.length ? h("ul", {}, a.decision.map((x) => h("li", {}, x))) : h("p", { class: "note" }, "Rien."),
          ...a.actions.map((x) => h("div", { class: "file", "data-file": x.finalite },
            ...x.actions.map((y) => h("button", { class: "btn discret petit", "data-action": y.action, onclick: () => decider(x.finalite, y.action) }, y.libelle))))),
        h("div", {}, h("span", { class: "surtitre" }, "Expire bientôt"), a.expire.length ? h("ul", {}, a.expire.map((x) => h("li", {}, x))) : h("p", { class: "note" }, "Rien.")));
      $("#grille").replaceChildren(...r.capacites.map(carte));
      const c = r.capacites.find((x) => x.finalite === choisie);
      $("#passeport").replaceChildren(...(c ? [passeport(c)] : []));
    }
    const recits = {};
    function recit(r) {
      return [h("ul", {}, r.phrases.map((p) => h("li", {}, `${p.texte} `, h("span", { class: "note" }, `[${p.faits.join(", ")}]`)))),
        h("p", { class: "note", "data-role": "recit-ia" }, r.ia.libelle),
        h("details", {}, h("summary", {}, "Les faits cités"), h("ul", {}, r.faits.map((f) => h("li", {}, `${f.id} — ${f.texte}`))))];
    }
    async function rediger(finalite) {
      try {
        const r = await fetch(`/api/pulse/console/capacites/${encodeURIComponent(finalite)}/recit`, { method: "POST", headers: { "X-Pulse-Console": jeton() } });
        if (!r.ok) throw new Error(`serveur : ${r.status}`);
        recits[finalite] = await r.json(); rendre(derniere);
      } catch (e) { $("#fraicheur").textContent = "récit indisponible : réessayez"; $("#fraicheur").className = "puce rouge"; }
    }
    // QR JURÉ : un passe court (15 min), à usage unique, pour le téléphone d'un personnage FICTIF absent de la scène
    $("#qr-jure").addEventListener("click", async () => {
      try {
        const r = await fetch("/api/pulse/console/jure", { method: "POST", headers: { "X-Pulse-Console": jeton(), "Content-Type": "application/json" },
          body: JSON.stringify({ persona: "s14", minutes: 15 }) });
        const p = await r.json();
        if (!r.ok) throw new Error(p.detail || `serveur : ${r.status}`);
        const heure = new Date(p.expire * 1000).toLocaleTimeString("fr-CH", { hour: "2-digit", minute: "2-digit" });
        $("#jure").replaceChildren(h("section", { class: "passeport", "aria-label": "QR juré" }, h("span", { class: "surtitre" }, "QR juré"),
          h("h2", {}, `Jouez ${p.personnage} (fictif) sur votre téléphone`), h("img", { src: p.qr, alt: "QR code du passe de juré", style: "width:min(60vw,280px);background:#fff;padding:8px" }),
          h("p", { class: "note", "data-role": "jure-regle" }, `Valable une seule fois, jusqu'à ${heure}. Un QR déjà scanné ne donne plus rien.`)));
      } catch (e) { $("#jure").replaceChildren(h("p", { class: "note" }, "QR juré indisponible : " + e.message)); }
    });
    let ia = null;
    async function lireIA() {
      try {
        const r = await fetch("/api/pulse/console/ia", { headers: { "X-Pulse-Console": jeton() } });
        ia = await r.json();
        $("#ia").textContent = !ia.actif ? "IA : éteinte — forme déterministe" : ia.configure ? `IA : allumée — modèle « ${ia.modele} »` : "IA : aucun modèle configuré — forme déterministe";
        $("#ia").className = "puce" + (ia.actif && ia.configure ? " vert" : "");
        $("#ia-bascule").textContent = ia.actif ? "Éteindre l'IA" : "Allumer l'IA";
      } catch (e) { $("#ia").textContent = "IA : état inconnu"; }
    }
    $("#ia-bascule").addEventListener("click", async () => {
      await fetch("/api/pulse/console/ia", { method: "POST", headers: { "X-Pulse-Console": jeton(), "Content-Type": "application/json" },
        body: JSON.stringify({ actif: !(ia && ia.actif) }) });
      await lireIA();
    });
    async function decider(finalite, action) {           // la FILE de l'animation : relancer ou acquitter, puis relire
      try {
        const r = await fetch(`/api/pulse/console/capacites/${encodeURIComponent(finalite)}/${action}`,
          { method: "POST", headers: { "X-Pulse-Console": jeton() } });
        if (!r.ok) throw new Error(`serveur : ${r.status}`);
      } catch (e) { $("#fraicheur").textContent = "action refusée : réessayez"; $("#fraicheur").className = "puce rouge"; }
      await lire();
    }
    let enCours = false;
    async function lire() {
      if (enCours) return; enCours = true;
      const t = performance.now();
      try {
        const r = await fetch("/api/pulse/console/capacites", { headers: { "X-Pulse-Console": jeton() } });
        if (!r.ok) throw new Error(`serveur : ${r.status}`);
        derniere = await r.json(); rendre(derniere);
        $("#fraicheur").textContent = `lu en ${Math.round(performance.now() - t)} ms`; $("#fraicheur").className = "puce";
      } catch (e) {
        $("#fraicheur").textContent = "hors ligne : écran figé"; $("#fraicheur").className = "puce rouge";   // jamais un état inventé
      } finally { enCours = false; }
    }
    $("#voir-pulse").addEventListener("click", async () => {
      try {
        const r = await fetch("/api/pulse/console/pulse?depuis=0", { headers: { "X-Pulse-Console": jeton() } });
        const p = await r.json();
        const bloc = (titre, items) => h("div", {}, h("span", { class: "surtitre" }, titre),
          items.length ? h("ul", {}, items.map((x) => h("li", {}, `${x.titre} (${x.avant || "—"} → ${x.apres || "—"})`))) : h("p", { class: "note" }, "Rien."));
        $("#pulse").replaceChildren(h("section", { class: "passeport", "aria-label": "Pulse" }, h("span", { class: "surtitre" }, "Pulse"),
          h("h2", {}, `Depuis l'ouverture (${jour(p.depuis.date)}) jusqu'à maintenant (${jour(p.jusqu_a.date)})`),
          h("div", { class: "attention" }, bloc("Apparues", p.apparues), bloc("Éteintes", p.eteintes), bloc("Recomposées", p.recomposees)),
          h("div", { class: "attention" }, bloc("Fragiles", p.fragiles), bloc("À une pièce près", p.a_une_piece), h("div", {}, h("p", { class: "note" }, p.calcul)))));
      } catch (e) { $("#pulse").replaceChildren(h("p", { class: "note" }, "Pulse indisponible : réessayez.")); }
    });
    lire(); lireIA();
    setInterval(lire, 1000); setInterval(lireIA, 5000);
  </script>
</body>
</html>
