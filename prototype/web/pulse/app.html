<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <title>Club Pulse</title>
  <meta name="description" content="Club Pulse — essayer quelque chose ensemble, à vos conditions, et garder un résultat qui dit ses limites.">
  <link rel="manifest" href="/app/manifest.webmanifest">
  <link rel="icon" href="/static/pulse/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/pulse/icone.svg">
  <link rel="stylesheet" href="/static/pulse/pulse.css">
  <style>
    body { background: var(--papier); }
    .app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }
    header.haut { position: sticky; top: 0; z-index: 5; background: var(--papier); display: flex; align-items: center; gap: 10px;
      padding: calc(12px + env(safe-area-inset-top)) 0 12px; border-bottom: 1px solid var(--ligne); }
    header.haut .qui { margin-left: auto; font-size: 13px; color: var(--encre-2); text-align: right; }
    main { padding-top: 18px; }
    .grand { font-size: clamp(24px, 6.5vw, 32px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; }
    nav.onglets { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--ligne); z-index: 6;
      display: grid; grid-template-columns: repeat(3, 1fr); padding-bottom: env(safe-area-inset-bottom); }
    nav.onglets a { text-decoration: none; font-size: 12px; font-weight: 600; color: var(--encre-3); display: grid; justify-items: center; gap: 2px; padding: 9px 2px 10px; min-height: 56px; }
    nav.onglets a span { font-size: 19px; line-height: 1; }
    nav.onglets a[aria-current="page"] { color: var(--encre); }
    .ligne { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .geste { border-left: 3px solid var(--ligne-forte); padding: 6px 0 6px 10px; margin-top: 10px; }
    .geste.vous { border-left-color: var(--rouge); }
    .alt { width: 100%; text-align: left; margin-top: 8px; }
    fieldset { border: 0; padding: 0; margin: 0; }
    .radios label { display: inline-flex; gap: 6px; align-items: center; margin: 6px 12px 0 0; font-size: 15px; }
    input[type="number"] { width: 90px; }
    details summary { cursor: pointer; font-weight: 600; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="app">
    <header class="haut">
      <span class="marque"><span class="pouls-point" aria-hidden="true"></span>Club Pulse</span>
      <span class="puce fictif" title="Monde de démonstration : personnes, entreprises et dates inventées">fictif</span>
      <span class="qui" id="qui"></span>
    </header>
    <main id="ecran" aria-live="polite"></main>
  </div>
  <nav class="onglets" id="onglets" aria-label="Navigation" hidden>
    <a href="#actions" data-o="actions"><span aria-hidden="true">◉</span>Mes actions</a>
    <a href="#nouveau" data-o="nouveau"><span aria-hidden="true">＋</span>Proposer un essai</a>
    <a href="#souvenirs" data-o="souvenirs"><span aria-hidden="true">◈</span>Souvenirs et accords</a>
  </nav>
  <div id="toasts" aria-live="assertive"></div>
  <script type="module">
    const $ = (s, r = document) => r.querySelector(s);
    function h(tag, attrs = {}, ...enfants) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v === null || v === undefined || v === false) continue;
        if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
        else if (k === "value") el.value = v; else el.setAttribute(k, v === true ? "" : v);
      }
      for (const e of enfants.flat(Infinity)) if (e !== null && e !== undefined && e !== false) el.append(e instanceof Node ? e : document.createTextNode(String(e)));
      return el;
    }
    const lire = (k) => { try { return sessionStorage.getItem(k); } catch { return null; } };
    const ecrire = (k, v) => { try { v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch { /* stockage indisponible */ } };
    const params = new URLSearchParams(location.search);
    let session = params.get("session") || lire("pulse-session");
    if (params.get("session")) {                    // jeton reçu de la console : rangé, puis RETIRÉ de l'adresse (historique, captures)
      ecrire("pulse-session", session);
      params.delete("session"); params.delete("t");
      history.replaceState(null, "", location.pathname + (params.toString() ? "?" + params : "") + location.hash);
    }
    function toast(msg, genre = "") { const t = h("div", { class: "toast " + genre }, msg); $("#toasts").append(t); setTimeout(() => t.remove(), 4200); }
    // Chaque navigation ouvre une GÉNÉRATION : une réponse arrivée après qu'on a changé d'écran est périmée et n'est jamais
    // affichée. Les lectures en cours sont annulées.
    let generation = 0, lectures = new AbortController();
    class Perime extends Error {}
    const DELAI_MS = 15000;
    const MESSAGES = { 403: "Vous n'avez pas accès à cet élément.", 429: "Trop de demandes : réessayez dans une minute." };
    async function api(chemin, { methode, corps } = {}) {
      const g = generation;
      const lecture = corps === undefined && !methode;
      const o = { method: methode || (corps === undefined ? "GET" : "POST"), headers: {} };
      if (session) o.headers["X-Pulse-Session"] = session;
      if (corps !== undefined) { o.headers["Content-Type"] = "application/json"; o.body = JSON.stringify(corps); }
      const signaux = [AbortSignal.timeout ? AbortSignal.timeout(DELAI_MS) : null, lecture ? lectures.signal : null].filter(Boolean);
      if (signaux.length) o.signal = AbortSignal.any ? AbortSignal.any(signaux) : signaux[0];
      let r;
      try { r = await fetch(chemin, o); } catch (e) {
        if (lecture && g !== generation) throw new Perime();
        if (e && e.name === "TimeoutError") throw new Error("Le serveur ne répond pas : réessayez.");
        throw new Error(navigator.onLine === false ? "Hors ligne : Club Pulse a besoin du réseau pour cette action." : "Serveur injoignable : réessayez.");
      }
      const d = await r.json().catch(() => ({}));
      if (r.status === 401) { ecrire("pulse-session", null); session = null; if (location.hash !== "#acces") location.hash = "#acces"; throw new Error("Session expirée : entrez à nouveau votre code."); }
      if (lecture && g !== generation) throw new Perime();
      if (r.status >= 500) throw new Error(`Erreur du serveur${d.requete ? " (référence " + d.requete + ")" : ""} : réessayez.`);
      if (!r.ok) throw new Error(MESSAGES[r.status] || (typeof d.detail === "string" ? d.detail : "Données invalides."));
      return d;
    }
    const section = (titre, ...enfants) => h("div", { class: "bloc" }, h("span", { class: "surtitre" }, titre), ...enfants);
    const afficher = (...enfants) => $("#ecran").replaceChildren(...enfants.flat().filter(Boolean));
    const vide = (texte) => h("p", { class: "note" }, texte);
    const agir = (fn, message) => async () => { try { await fn(); if (message) toast(message); route(true); } catch (e) { toast(e.message, "erreur"); } };
    const modeIA = (ia) => ia && ia.fournisseur === "apertus" && !ia.repli ? `Préparé par Apertus · ${ia.modele || ""} — à vérifier`
      : "Formulaire : aucun modèle utilisé. Règles simples seulement (texte recopié, objet reconnu dans une courte liste) ; le reste est à compléter par vous.";

    // ------------------------------------------------------------------ accès
    function ecranAcces() {
      const code = h("input", { id: "code", inputmode: "text", autocomplete: "one-time-code", maxlength: 12, value: params.get("code") || "" });
      afficher(h("p", { class: "surtitre" }, "Club des Affaires"), h("h1", { class: "grand" }, "Activez votre compte du Club"),
        h("p", { class: "note", style: "margin-top:8px" }, "Vous êtes déjà membre : pas d'inscription. Le code figure sur l'invitation du Club."),
        h("div", { class: "champ" }, h("label", { for: "code" }, "Code d'invitation"), code),
        h("div", { class: "actions", style: "margin-top:14px" }, h("button", { class: "btn plein", onclick: async () => {
          try { const r = await api("/api/pulse/acces", { corps: { code: code.value.trim() } }); session = r.session; ecrire("pulse-session", session);
            ecrire("pulse-nom", r.nom); location.hash = "#actions"; } catch (e) { toast(e.message, "erreur"); } } }, "Continuer")),
        h("p", { class: "note", style: "margin-top:18px" }, "Démonstration : membres et entreprises fictifs."));
    }

    // ------------------------------------------------------------------ A. mes actions
    const carte = (x, extra) => h("a", { class: "carte cliquable", href: `#essai/${x.id}`, style: "display:block;text-decoration:none;color:inherit" },
      h("span", { class: "surtitre" }, x.etat), h("h3", { style: "margin-top:4px" }, x.question),
      h("p", { class: "note" }, `Porteur : ${x.porteur}`), extra ? h("p", { style: "margin-top:6px" }, extra) : null);
    async function ecranActions() {
      const a = await api("/api/pulse/moi/actions");
      afficher(h("h1", { class: "grand" }, "Mes actions"),
        section("Attend votre choix", a.a_choisir.length ? a.a_choisir.map((x) => carte(x, x.attend)) : vide("Rien n'attend votre choix.")),
        section("Mes contributions en cours", a.contributions.length ? a.contributions.map((x) => carte(x)) : vide("Aucune.")),
        section("Mes essais", a.mes_essais.length ? a.mes_essais.map((x) => carte(x)) : vide("Aucun essai en cours. Onglet « Proposer un essai » pour en préparer un.")),
        section("Résultats récents", a.recents.length ? a.recents.map((x) => carte(x, x.qualification ? `Observation : ${x.qualification}` : null)) : vide("Aucun.")));
    }

    // ------------------------------------------------------------------ B1. préparer un essai (formulation → brouillon)
    const TEMPLATES = [["temps", "Regarder l'objet quelques secondes et dire ce que vous avez compris", 10],
                       ["lieu", "Présenter l'objet dans un lieu réel (stand, vitrine)", 15],
                       ["objet", "Prêter un objet pour l'essai", 15], ["competence", "Donner un avis de professionnel", 15]];
    async function ecranNouveau() {
      const t = h("textarea", { rows: 4, id: "formulation", maxlength: 600, placeholder: "Ex. : Notre nouvelle étiquette est-elle comprise en 10 secondes à 1 mètre par quelqu'un qui ne connaît pas la marque ?" });
      const zone = h("div");
      afficher(h("h1", { class: "grand" }, "Proposer un essai"),
        h("p", { class: "note", style: "margin-top:6px" }, "Une question concrète sur un objet, un support ou un usage. D'autres membres pourront vous aider à l'essayer, à LEURS conditions."),
        h("div", { class: "champ" }, h("label", { for: "formulation" }, "Votre question, avec vos mots"), t),
        h("div", { class: "actions", style: "margin-top:8px" }, h("button", { class: "btn plein", id: "preparer", onclick: async () => {
          try { const p = await api("/api/pulse/moi/essais/preparer", { corps: { texte: t.value } }); zone.replaceChildren(formulaire(p)); }
          catch (e) { toast(e.message, "erreur"); } } }, "Préparer la proposition")), zone);
    }
    function formulaire(p) {
      const champ = (id, label, valeur, rows) => h("div", { class: "champ" }, h("label", { for: id }, label),
        rows ? h("textarea", { id, rows, maxlength: 300, value: valeur || "" }) : h("input", { id, maxlength: 300, value: valeur || "" }));
      const gestes = h("div", { id: "gestes" });
      const ajouter = (nature, geste, duree) => gestes.append(h("div", { class: "geste", "data-nature": nature },
        h("p", { class: "note" }, `Geste demandé · ${nature}`), h("input", { class: "g-texte", maxlength: 200, value: geste, "aria-label": "Geste" }),
        h("div", { class: "ligne", style: "margin-top:6px" }, h("input", { class: "g-duree", type: "number", min: 1, max: 120, value: duree, "aria-label": "Durée en minutes" }),
          h("span", { class: "note" }, "minutes"), h("button", { class: "btn discret petit", onclick: (e) => e.currentTarget.closest(".geste").remove() }, "Retirer"))));
      (p.etapes || []).forEach((e) => ajouter(e.nature, e.geste, e.duree_min));
      return h("div", { class: "carte", style: "margin-top:14px" }, h("p", { class: "ia" }, modeIA(p.ia)),
        champ("f-question", "Ce que nous essayons de savoir", p.question, 2), champ("f-objet", "L'objet, le support ou l'usage", p.objet),
        champ("f-critere", "Critère d'observation : comment lirez-vous le résultat ?", p.critere, 2),
        champ("f-pourquoi", "Pourquoi (contexte, facultatif)", p.pourquoi || "", 2),
        h("div", { class: "champ" }, h("label", { for: "f-echeance" }, "Échéance"), h("input", { id: "f-echeance", type: "date", value: p.echeance })),
        section("Gestes demandés à d'autres membres", gestes,
          h("div", { class: "ligne" }, TEMPLATES.map(([n, g, d]) => h("button", { class: "btn discret petit", style: "margin-top:8px", onclick: () => ajouter(n, g, d) }, `+ ${n}`)))),
        h("div", { class: "actions", style: "margin-top:14px" }, h("button", { class: "btn plein", id: "enregistrer", onclick: async () => {
          const corps = { question: $("#f-question").value, objet: $("#f-objet").value, critere: $("#f-critere").value, pourquoi: $("#f-pourquoi").value,
            echeance: $("#f-echeance").value, etapes: [...gestes.children].map((g) => ({ nature: g.dataset.nature, geste: g.querySelector(".g-texte").value,
              duree_min: Number(g.querySelector(".g-duree").value) })) };
          try { const e = p.id ? await api(`/api/pulse/moi/essais/${p.id}/brouillon?version=${p.version}`, { methode: "PUT", corps })
                            : await api("/api/pulse/moi/essais", { corps });
            location.hash = `#essai/${e.id}`; } catch (e) { toast(e.message, "erreur"); } } }, p.id ? "Enregistrer le brouillon corrigé" : "Enregistrer le brouillon")),
        h("p", { class: "note", style: "margin-top:8px" }, "Rien n'est envoyé à personne tant que vous n'avez pas publié la proposition."));
    }

    // ------------------------------------------------------------------ B2. une proposition / un essai
    async function ecranEssai(id) {
      const e = await api(`/api/pulse/moi/essais/${id}`);
      if (e.role === "ancien") {
        afficher(h("h1", { class: "grand" }, e.question), h("p", { class: "encadre", style: "margin-top:12px" }, e.etat),
          h("p", { class: "note" }, `Votre décision : ${e.votre_decision}. Rien ne vous sera redemandé pour cet essai.`)); return;
      }
      const post = (chemin, corps, message) => agir(() => api(`/api/pulse/moi/essais/${id}/${chemin}`, { corps: corps ?? {} }), message);
      const A = new Set(e.actions);
      const gestes = e.etapes.map((g) => h("div", { class: "geste" + (g.vous ? " vous" : "") },
        h("div", { class: "ligne" }, h("b", {}, g.geste), h("span", { class: "puce" }, `${g.duree_min} min`)),
        h("p", { class: "note" }, `${g.nature} · ${g.vous ? "vous" : g.qui} · ${g.statut}`),
        g.offre ? h("p", { class: "note" }, `Offre : « ${g.offre.quoi} »${g.offre.duree_max_min ? ` · ${g.offre.duree_max_min} min au plus` : ""}${g.offre.conditions ? " · " + g.offre.conditions : ""} · jusqu'au ${g.offre.jusqu_au}`) : null,
        g.offres_admissibles ? (g.offres_admissibles.length ? h("fieldset", { class: "radios" }, h("legend", { class: "note" }, "Offres admissibles (vous choisissez) :"),
          g.offres_admissibles.map((o, i) => h("label", { style: "display:flex" }, h("input", { type: "radio", name: `choix-${g.id}`, value: o.id, checked: i === 0 }),
            `« ${o.quoi} »${o.duree_max_min ? ` · ${o.duree_max_min} min au plus` : ""}${o.conditions ? " · " + o.conditions : ""}`)))
          : h("p", { class: "encadre" }, "Personne n'offre ce geste aujourd'hui : modifiez-le ou retirez-le.")) : null,
        e.role === "porteur" && A.has("constater") && g.statut !== "contribution reçue" ? h("button", { class: "btn discret petit", style: "margin-top:6px",
          onclick: post(`contributions/${g.id}`, {}, "Contribution constatée (ce n'est pas un résultat).") }, "Contribution reçue") : null));
      const blocs = [
        h("p", { class: "surtitre" }, `Essai · version ${e.version} · ${e.mode}`), h("h1", { class: "grand" }, e.question),
        h("p", { style: "margin-top:8px" }, h("span", { class: "puce" + (e.etat === "A_ADAPTER" || e.etat === "IMPOSSIBLE" ? " rouge" : "") }, e.etat_libelle)),
        h("p", { class: "note", style: "margin-top:6px" }, `Porteur : ${e.porteur}${e.objet ? " · objet : " + e.objet : ""} · échéance : ${e.echeance}`),
        section("Prochaine décision", h("p", { class: "encadre" }, e.prochaine)),
        e.pourquoi ? section("Pourquoi", h("p", {}, e.pourquoi)) : null,
        section("Critère d'observation", h("p", {}, e.critere || "—")),
        section("Qui fait quoi", gestes),
        e.manque.length ? section("Ce qui manque", h("ul", {}, e.manque.map((x) => h("li", {}, x)))) : null,
        section("Ce qui sera partagé", h("p", { class: "note" }, e.partage))];
      if (e.adaptation) {
        const ad = e.adaptation;
        blocs.push(section("Une condition a changé", h("p", {}, ad.cause),
          ad.ne_couvre_plus.length ? h("p", { class: "encadre" }, "Ne couvre plus : " + ad.ne_couvre_plus.join(" · ")) : null,
          ad.reste_valable.length ? h("p", { class: "note" }, "Reste valable (rien à redonner) : " + ad.reste_valable.join(", ")) : null,
          ad.alternatives.map((x) => h("button", { class: "btn discret alt", onclick: post("adapter", { version: e.version, alternative: x.id }, "Nouvelle version : les personnes concernées choisissent.") }, x.texte)),
          e.role === "porteur" ? h("p", { class: "note" }, "Le système ne remplace personne et ne change pas votre objectif sans votre choix.") : null));
      }
      const acts = [];
      if (A.has("publier")) acts.push(h("button", { class: "btn plein", id: "publier", onclick: () => post("publier", { version: e.version,
        choix: Object.fromEntries([...document.querySelectorAll("input[type=radio][name^=choix-]:checked")].map((x) => [x.name.slice(6), x.value])) },
        "Proposition publiée : chaque personne choisit sa part.")() }, "Publier la proposition"));
      if (A.has("corriger")) acts.push(h("button", { class: "btn discret", onclick: () => { location.hash = `#nouveau/${e.id}`; } }, "Corriger le brouillon"));
      if (A.has("accepter")) acts.push(h("button", { class: "btn plein", id: "accepter", onclick: post("decision", { version: e.version, accepte: true }, "Accord donné pour cette version.") }, "Accepter ma part"),
        h("button", { class: "btn discret", id: "decliner", onclick: post("decision", { version: e.version, accepte: false }, "Vous avez décliné. Personne ne le verra nommément.") }, "Décliner"));
      if (A.has("lancer")) acts.push(h("button", { class: "btn rouge", id: "lancer", onclick: post("lancer", { version: e.version }, "Essai lancé.") }, "Lancer l'essai"));
      if (A.has("modifier")) {
        const c = h("input", { id: "nouveau-critere", maxlength: 300, placeholder: "Nouveau critère" });
        acts.push(h("details", {}, h("summary", {}, "Modifier le critère"), h("div", { class: "champ" }, c),
          h("button", { class: "btn discret petit", onclick: post("modifier", { version: e.version, get critere() { return c.value; } }, "Nouvelle version.") }, "Enregistrer (les personnes concernées devront choisir à nouveau)")));
      }
      if (A.has("observer") || A.has("corriger_observation")) acts.push(formObservation(id));
      if (A.has("confirmer")) {
        const r = h("input", { id: "raison", maxlength: 300, placeholder: "Ce que vous contestez (obligatoire pour contester)" });
        acts.push(h("div", { class: "carte" }, h("span", { class: "surtitre" }, "Votre avis sur l'observation"), h("div", { class: "champ" }, r),
          h("div", { class: "actions" }, h("button", { class: "btn discret petit", onclick: post("avis", { revision: e.observation.revision, avis: "confirme" }, "Confirmé.") }, "Je confirme"),
            h("button", { class: "btn discret petit", onclick: () => post("avis", { revision: e.observation.revision, avis: "conteste", raison: r.value }, "Contestation enregistrée.")() }, "Je conteste"))));
      }
      if (A.has("reutilisation")) acts.push(formReutilisation(id, e.reutilisation));
      if (e.votre_part && !e.final) acts.push(formMonOffre(e));
      if (A.has("retirer")) acts.push(h("button", { class: "btn discret petit", onclick: post("retirer", {}, "Participation retirée.") }, "Retirer ma participation"));
      if (A.has("annuler")) acts.push(h("button", { class: "btn discret petit", onclick: post("annuler", { raison: "annulé par le porteur" }, "Essai annulé.") }, "Annuler l'essai"));
      if (acts.length) blocs.push(section("Vos actions", h("div", { class: "actions", style: "flex-direction:column;align-items:stretch" }, acts)));
      if (e.observation) blocs.push(carteObservation(e.observation, e.reutilisation));
      blocs.push(h("details", {}, h("summary", {}, "Historique"), h("ol", { class: "chrono" }, e.historique.map((x) => h("li", {}, h("span", { class: "note" }, x.le + " · "), x.quoi)))));
      afficher(blocs);
    }
    function formMonOffre(e) {
      const g = e.votre_part.gestes.find((x) => x.offre_id);
      if (!g) return null;
      const d = h("input", { id: "ma-duree", type: "number", min: 1, max: 240, value: g.offre.duree_max_min || "" });
      return h("details", {}, h("summary", {}, "Mes conditions ont changé"),
        h("p", { class: "note" }, `Votre offre : « ${g.offre.quoi} »`), h("div", { class: "ligne" }, h("label", { for: "ma-duree" }, "Je peux donner au plus"), d, h("span", {}, "minutes")),
        h("button", { class: "btn discret petit", id: "changer-duree", onclick: agir(() => api(`/api/pulse/moi/offres/${g.offre_id}`, {
          methode: "PATCH", corps: { duree_max_min: Number(d.value) } }), "Conditions mises à jour : les essais concernés sont réévalués.") }, "Mettre à jour mon offre"));
    }
    function formObservation(id) {
      const t = h("textarea", { id: "obs-texte", rows: 3, maxlength: 1000, placeholder: "Ce que vous avez observé, sans l'arranger" });
      const l = h("input", { id: "obs-limites", maxlength: 300, placeholder: "Portée : combien de personnes, quelles conditions" });
      const q = h("div", { class: "radios" }, [["positif", "positif"], ["negatif", "négatif"], ["mitige", "mitigé"], ["non_concluant", "non concluant"]].map(([v, lib]) =>
        h("label", {}, h("input", { type: "radio", name: "qualif", value: v }), lib)));
      return h("div", { class: "carte" }, h("span", { class: "surtitre" }, "Déclarer l'observation"),
        h("p", { class: "note" }, "C'est votre déclaration : le système ne l'a pas vérifiée et le dira. Un résultat négatif est un résultat."),
        h("div", { class: "champ" }, t), q, h("div", { class: "champ" }, l),
        h("button", { class: "btn plein", id: "observer", style: "margin-top:8px", onclick: agir(() => api(`/api/pulse/moi/essais/${id}/observation`, { corps: {
          texte: t.value, limites: l.value, qualification: (document.querySelector("input[name=qualif]:checked") || {}).value } }), "Observation enregistrée.") }, "Enregistrer l'observation"));
    }
    function formReutilisation(id, r) {
      const choix = h("div", { class: "radios" }, [["moi", "moi seul·e"], ["participants", "les participants"], ["club", "les membres du Club"]].map(([v, lib]) =>
        h("label", {}, h("input", { type: "radio", name: "niveau", value: v, checked: r && r.vous && r.vous.niveau === v }), lib)));
      const nom = h("label", { class: "bascule" }, h("input", { type: "checkbox", id: "mention-nom", checked: r && r.vous && r.vous.mention === "nom" }), h("span", {}, "Mon nom peut être cité"));
      return h("div", { class: "carte" }, h("span", { class: "surtitre" }, "Qui peut réutiliser ce résultat ?"),
        h("p", { class: "note" }, `Niveau effectif aujourd'hui : ${r ? r.niveau_effectif : "participants"} (le plus restrictif de tous les participants l'emporte).`), choix, nom,
        h("button", { class: "btn discret petit", style: "margin-top:8px", onclick: agir(() => api(`/api/pulse/moi/essais/${id}/reutilisation`, { corps: {
          niveau: (document.querySelector("input[name=niveau]:checked") || {}).value || "participants", mention: $("#mention-nom").checked ? "nom" : "anonyme" } }), "Choix enregistré.") }, "Enregistrer mon choix"));
    }
    function carteObservation(o, r) {
      return section("Observation", h("div", { class: "carte" }, h("p", { class: "note" }, `${o.nature} · auteur : ${o.auteur}${o.tardive ? " · déclarée après l'échéance" : ""}${o.revisions > 1 ? ` · ${o.revisions} versions` : ""}`),
        h("p", { style: "margin-top:6px" }, h("span", { class: "puce" }, o.qualification), " ", o.texte),
        h("p", { class: "note", style: "margin-top:6px" }, `Portée : ${o.limites}`),
        h("p", { class: "note" }, `${o.confirmations} confirmation(s)`),
        o.contestations.map((c) => h("p", { class: "encadre" }, `Contestée par ${c.par} : ${c.raison}`)),
        r ? h("p", { class: "note" }, `Visible aujourd'hui par : ${r.niveau_effectif}`) : null));
    }
    async function ecranCorriger(id) {
      const e = await api(`/api/pulse/moi/essais/${id}`);
      afficher(h("h1", { class: "grand" }, "Corriger le brouillon"), formulaire({ id: e.id, version: e.version, question: e.question, objet: e.objet, critere: e.critere,
        pourquoi: e.pourquoi, echeance: e.echeance, etapes: e.etapes.map((g) => ({ nature: Object.entries({ temps: "quelques minutes", lieu: "un lieu", objet: "un objet", competence: "une compétence" }).find(([, v]) => v === g.nature)[0], geste: g.geste, duree_min: g.duree_min })),
        ia: null }));
    }

    // ------------------------------------------------------------------ C. souvenirs et accords
    async function ecranSouvenirs() {
      const s = await api("/api/pulse/moi/souvenirs");
      const note = h("textarea", { id: "note", rows: 3, maxlength: 2000, placeholder: "Une rencontre, une idée — visible par vous seul·e" });
      const nouvelle = offreForm();
      afficher(h("h1", { class: "grand" }, "Souvenirs et accords"), h("p", { class: "note", style: "margin-top:6px" }, s.rappel),
        section("Notes privées · vous seul·e", h("div", { class: "champ" }, note), h("button", { class: "btn discret petit", onclick: agir(() => api("/api/pulse/moi/notes", { corps: { texte: note.value } }), "Note gardée, privée.") }, "Garder cette note"),
          s.notes_privees.length ? s.notes_privees.slice().reverse().map((n) => h("div", { class: "carte" }, h("p", { class: "note" }, `${n.le} · ${n.visibilite}`), h("p", {}, n.texte))) : vide("Aucune note.")),
        section("Mes offres volontaires", s.offres.length ? s.offres.map((o) => h("div", { class: "carte" }, h("div", { class: "ligne" }, h("b", {}, o.quoi), h("span", { class: "puce" }, o.etat)),
          h("p", { class: "note" }, `${o.nature}${o.duree_max_min ? ` · ${o.duree_max_min} min au plus` : ""} · ${o.reservees}/${o.capacite} utilisée(s) · du ${o.du} au ${o.au}${o.conditions ? " · " + o.conditions : ""}`),
          o.etat === "active" ? h("button", { class: "btn discret petit", onclick: agir(() => api(`/api/pulse/moi/offres/${o.id}/retirer`, { corps: {} }), "Offre retirée : les essais concernés sont réévalués.") }, "Retirer cette offre") : null))
          : vide("Aucune offre. Une compétence passée n'est pas une disponibilité : publiez seulement ce que vous acceptez de donner."), nouvelle),
        section("Mes accords", s.accords.length ? s.accords.map((a) => h("div", { class: "carte" }, h("div", { class: "ligne" }, h("b", {}, a.statut), h("span", { class: "puce" + (a.encore_valable ? " vert" : "") }, a.encore_valable ? "encore valable" : "ne vaut plus pour la version actuelle")),
          h("p", { class: "note" }, `${a.le} · version ${a.version ?? "—"} · « ${a.question} »`), a.portee ? h("p", { class: "note" }, a.portee) : null)) : vide("Aucun accord.")),
        section("Contributions passées", s.contributions.length ? s.contributions.map((c) => h("p", {}, `${c.le} · « ${c.question} » · constatée par ${c.constatee_par}`)) : vide("Aucune.")),
        section("Observations", s.observations.length ? s.observations.map((o) => h("a", { class: "carte cliquable", href: `#essai/${o.essai}`, style: "display:block;text-decoration:none;color:inherit" },
          h("p", {}, h("span", { class: "puce" }, o.qualification), " « ", o.question, " »"), h("p", { class: "note" }, `${o.nature} · portée : ${o.limites} · visible par : ${o.niveau_effectif}`))) : vide("Aucune.")),
        section("Réutilisable par le Club", s.reutilisables.length ? s.reutilisables.map((o) => h("p", {}, `« ${o.question} » — ${o.qualification}`)) : vide("Rien : chaque participant doit l'autoriser explicitement.")),
        h("div", { class: "actions", style: "margin-top:18px" }, h("button", { class: "btn discret petit", onclick: () => { ecrire("pulse-session", null); session = null; location.hash = "#acces"; } }, "Se déconnecter")));
    }
    function offreForm() {
      const q = h("input", { id: "o-quoi", maxlength: 200, placeholder: "Ce que vous acceptez de donner" });
      const n = h("select", { id: "o-nature" }, ["temps", "lieu", "objet", "competence"].map((x) => h("option", { value: x }, x)));
      const d = h("input", { id: "o-duree", type: "number", min: 1, max: 240, value: 15 });
      const au = h("input", { id: "o-au", type: "date" });
      return h("details", {}, h("summary", {}, "Publier une offre"), h("div", { class: "champ" }, q), h("div", { class: "ligne" }, n, d, h("span", {}, "min au plus · jusqu'au"), au),
        h("button", { class: "btn discret petit", style: "margin-top:8px", onclick: agir(() => api("/api/pulse/moi/offres", { corps: { nature: n.value, quoi: q.value, duree_max_min: Number(d.value),
          capacite: 1, au: au.value } }), "Offre publiée.") }, "Publier"));
    }

    // ------------------------------------------------------------------ routeur
    async function route(silencieux = false) {
      const g = ++generation;
      lectures.abort(); lectures = new AbortController();
      const [nom, id] = (location.hash.slice(1) || "actions").split("/");
      if (!session && nom !== "acces") { location.hash = "#acces"; return; }
      $("#onglets").hidden = nom === "acces";
      $("#qui").textContent = session ? (lire("pulse-nom") || "") : "";
      document.querySelectorAll("#onglets a").forEach((a) => a.setAttribute("aria-current", a.dataset.o === nom || (nom === "essai" && a.dataset.o === "actions") ? "page" : "false"));
      const ecran = $("#ecran");
      ecran.setAttribute("aria-busy", "true");
      const attente = silencieux ? null : setTimeout(() => { if (g === generation) ecran.replaceChildren(h("p", { class: "note", role: "status" }, "Chargement…")); }, 250);
      try {
        await ({ acces: ecranAcces, actions: ecranActions, nouveau: () => (id ? ecranCorriger(id) : ecranNouveau()), essai: () => ecranEssai(id),
          souvenirs: ecranSouvenirs }[nom] || ecranActions)();
      } catch (e) {
        if (e instanceof Perime || g !== generation) return;
        ecran.replaceChildren(h("div", { class: "carte", role: "alert" }, h("span", { class: "surtitre" }, "Impossible d'afficher cet écran"),
          h("p", { style: "margin-top:6px" }, e.message), h("div", { class: "actions", style: "margin-top:10px" }, h("button", { class: "btn plein petit", onclick: () => route() }, "Réessayer"))));
      } finally {
        clearTimeout(attente);
        if (g === generation) ecran.removeAttribute("aria-busy");
      }
      if (g === generation && !silencieux) window.scrollTo(0, 0);
    }
    // les autres participants agissent depuis LEUR téléphone : on relit discrètement l'écran courant, sans toucher un champ en cours
    setInterval(() => {
      const nom = (location.hash.slice(1) || "actions").split("/")[0];
      const saisie = document.activeElement && document.activeElement.matches("input, textarea, select");
      const ouvert = document.querySelector("details[open]");
      if (session && document.visibilityState === "visible" && !saisie && !ouvert && ["actions", "essai"].includes(nom)) route(true);
    }, 4000);
    window.addEventListener("hashchange", () => route());
    window.addEventListener("online", () => toast("De retour en ligne."));
    window.addEventListener("offline", () => toast("Hors ligne : les actions attendront le réseau.", "erreur"));
    if (params.get("code") && !session) location.hash = "#acces";
    route();
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/app/sw.js", { scope: "/app" }).catch(() => {});
  </script>
</body>
</html>
