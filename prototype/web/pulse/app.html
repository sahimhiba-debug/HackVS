<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F3F5">
  <title>Club Pulse</title>
  <meta name="description" content="Club Pulse — essayer quelque chose ensemble, à vos conditions, et garder un résultat qui dit ses limites.">
  <link rel="manifest" href="/app/manifest.webmanifest">
  <link rel="icon" href="/static/pulse/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/pulse/icone.svg">
  <link rel="stylesheet" href="/static/pulse/pulse.css">
  <style>
    body { background: var(--papier); }
    .app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }
    header.haut { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 10px;
      padding: calc(12px + env(safe-area-inset-top)) 0 12px; border-bottom: 1px solid var(--hairline-2); }
    header.haut .qui { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--secondary); text-align: right; }
    main { padding-top: 18px; }
    .grand { font-size: clamp(19px, 5.6vw, 22px); font-weight: 800; letter-spacing: -0.015em; line-height: 1.22; }
    nav.onglets { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--hairline-2); z-index: 6;
      display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom); }
    nav.onglets a { text-decoration: none; font-size: 10px; font-weight: 600; color: var(--secondary); display: grid; justify-items: center; align-content: start; gap: 3px; padding: 10px 2px 10px; min-height: 56px; text-align: center; }
    nav.onglets a span { font-size: 0; width: 21px; height: 21px; background: currentColor; -webkit-mask: var(--ic) center / contain no-repeat; mask: var(--ic) center / contain no-repeat; }   /* icônes pleines SVG, pas de caractères (§ 5.4) */
    nav.onglets a[data-o="actions"] { --ic: var(--ic-actions); } nav.onglets a[data-o="action"] { --ic: var(--ic-action); }
    nav.onglets a[data-o="nouveau"] { --ic: var(--ic-nouveau); } nav.onglets a[data-o="souvenirs"] { --ic: var(--ic-souvenirs); }
    nav.onglets a[data-o="demandes"] { --ic: var(--ic-demandes); }
    nav.onglets a[aria-current="page"] { color: var(--brand); font-weight: 800; }
    nav.onglets a:not([aria-current="page"]) span { background: var(--faint); }   /* icône : --faint (planche) ; libellé : --secondary, lisible (R-03 : 1,93:1 → 6:1) */
    .ligne { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .geste { border-left: 3px solid var(--ligne-forte); padding: 6px 0 6px 10px; margin-top: 10px; }
    .geste.vous { border-left-color: var(--ink); }
    .alt { width: 100%; text-align: left; justify-content: flex-start; margin-top: 8px; border-radius: var(--rayon-s); font-weight: 550; line-height: 1.35; padding: 12px 14px; }
    fieldset { border: 0; padding: 0; margin: 0; }
    .radios label { display: inline-flex; gap: 6px; align-items: center; margin: 6px 12px 0 0; font-size: 15px; }
    input[type="number"] { width: 90px; }
    details summary { cursor: pointer; font-weight: 600; margin-top: 12px; padding: 10px 0; min-height: 44px; }
    .creneau { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-top: 6px; }
    .palier { font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: var(--r-pill); background: var(--chip-neutral); color: var(--secondary); }
    .palier.reçu, .palier.apporté { background: var(--green); color: #FFFFFF; }
    .palier.accepté { background: var(--chip-neutral); color: var(--ink-2); }
    .palier.transmis, .palier.proposé, .palier.à.reconfirmer { background: var(--chip-neutral); color: var(--secondary); }
    .palier.transmis::before, .palier.proposé::before, .palier.à.reconfirmer::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 50%; background: var(--amber); }
    .palier.ne.couvre.plus, .palier.manquant { background: var(--brand-tint); color: var(--brand); }
    .fiche { white-space: pre-wrap; background: var(--card-sub); border: 1px solid var(--hairline); border-radius: var(--r-tile); padding: 10px 14px; margin-top: 6px; }
    .exigence { border: 1px solid var(--hairline); border-radius: var(--r-tile); padding: 10px 14px; margin-top: 8px; background: var(--card); }
    .exigence .x-geste, .exigence .x-livrable { width: 100%; margin-top: 6px; }
    .exigence .x-livrable { flex: 1 1 100%; }
    input[type="time"], input[type="date"] { min-width: 0; }
  </style>
</head>
<body>
  <div class="app">
    <header class="haut">
      <span class="marque"><span class="pouls-point" aria-hidden="true"></span>Club Pulse</span>
      <span class="puce fictif" title="Monde de démonstration : personnes, entreprises et dates inventées">fictif</span>
      <span class="puce" id="date-club" title="Date du Club (simulée en démonstration)" hidden></span>
      <span class="qui" id="qui"></span>
    </header>
    <p id="bandeau-jure" class="note" role="status" hidden style="margin:0;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--ligne)"></p>
    <main id="ecran" aria-live="polite"></main>
  </div>
  <nav class="onglets" id="onglets" aria-label="Navigation" hidden>
    <a href="#actions" data-o="actions"><span aria-hidden="true">◉</span>Mes actions</a>
    <a href="#action" data-o="action"><span aria-hidden="true">⧉</span>Agir à plusieurs</a>
    <a href="#nouveau" data-o="nouveau"><span aria-hidden="true">＋</span>Proposer un essai</a>
    <a href="#souvenirs" data-o="souvenirs"><span aria-hidden="true">◈</span>Souvenirs et accords</a>
    <a href="#demandes" data-o="demandes"><span aria-hidden="true">✦</span>Demandes</a>
  </nav>
  <div id="toasts" aria-live="assertive"></div>
  <script type="module">
    import { activer as activerAllemand, langueVoulue } from "/static/pulse/traduction-de.js";
    const $ = (s, r = document) => r.querySelector(s);
    function h(tag, attrs = {}, ...enfants) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v === null || v === undefined || v === false) continue;
        if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
        else if (k === "value") el.value = v; else el.setAttribute(k, v === true ? "" : v);
      }
      for (const e of enfants.flat(Infinity)) if (e !== null && e !== undefined && e !== false) el.append(e instanceof Node ? e : document.createTextNode(String(e)));
      return el;
    }
    const jourCourt = (iso) => `${["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."][new Date(iso + "T12:00:00").getDay()]} ${iso.slice(8, 10)}.${iso.slice(5, 7)}`;
    const lire = (k) => { try { return sessionStorage.getItem(k); } catch { return null; } };
    const ecrire = (k, v) => { try { v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch { /* stockage indisponible */ } };
    const params = new URLSearchParams(location.search);
    let session = params.get("session") || lire("pulse-session");
    if (params.get("session")) {                    // jeton reçu de la console : rangé, puis RETIRÉ de l'adresse (historique, captures)
      ecrire("pulse-session", session);
      params.delete("session"); params.delete("t");
      history.replaceState(null, "", location.pathname + (params.toString() ? "?" + params : "") + location.hash);
    }
    function toast(msg, genre = "") { const t = h("div", { class: "toast " + genre }, msg); $("#toasts").append(t); setTimeout(() => t.remove(), 4200); }
    // Chaque navigation ouvre une GÉNÉRATION : une réponse arrivée après qu'on a changé d'écran est périmée et n'est jamais
    // affichée. Les lectures en cours sont annulées.
    let generation = 0, lectures = new AbortController();
    class Perime extends Error {}
    const DELAI_MS = 15000;
    const MESSAGES = { 403: "Vous n'avez pas accès à cet élément.", 429: "Trop de demandes : réessayez dans une minute." };
    async function api(chemin, { methode, corps } = {}) {
      const g = generation;
      const lecture = corps === undefined && !methode;
      const o = { method: methode || (corps === undefined ? "GET" : "POST"), headers: {} };
      if (session) o.headers["X-Pulse-Session"] = session;
      if (corps !== undefined) { o.headers["Content-Type"] = "application/json"; o.body = JSON.stringify(corps); }
      const signaux = [AbortSignal.timeout ? AbortSignal.timeout(DELAI_MS) : null, lecture ? lectures.signal : null].filter(Boolean);
      if (signaux.length) o.signal = AbortSignal.any ? AbortSignal.any(signaux) : signaux[0];
      let r;
      try { r = await fetch(chemin, o); } catch (e) {
        if (lecture && g !== generation) throw new Perime();
        if (e && e.name === "TimeoutError") throw new Error("Le serveur ne répond pas : réessayez.");
        const erreur = new Error(navigator.onLine === false ? "Hors ligne : Club Pulse a besoin du réseau pour cette action." : "Serveur injoignable : réessayez.");
        erreur.reseau = true;                                     // ANNÉE 1 · lot 11 : la file hors ligne s'y fie
        throw erreur;
      }
      const d = await r.json().catch(() => ({}));
      if (r.status === 401) { ecrire("pulse-session", null); session = null; if (location.hash !== "#acces") location.hash = "#acces"; throw new Error("Session expirée : entrez à nouveau votre code."); }
      if (lecture && g !== generation) throw new Perime();
      if (r.status >= 500) throw new Error(`Erreur du serveur${d.requete ? " (référence " + d.requete + ")" : ""} : réessayez.`);
      if (!r.ok) throw new Error(MESSAGES[r.status] || (typeof d.detail === "string" ? d.detail : "Données invalides."));
      return d;
    }
    // ANNÉE 1 · LOT 11 — FILE D'ATTENTE HORS LIGNE des réponses (interrupteur HACKVS_HORS_LIGNE, dit par /moi/date).
    // Seules les réponses aux demandes y entrent ; une par demande (la dernière gagne) ; liée à la session qui l'a donnée.
    // Au retour du réseau, chacune est envoyée ; le serveur reste seul juge : une demande qui n'est plus d'actualité est
    // refusée, retirée de la file, et le membre le sait. Rien n'est jamais renvoyé deux fois après un refus.
    const horsLigne = (() => {
      const CLE = "pulse-file-hors-ligne", DRAPEAU = "pulse-hors-ligne";
      const lireL = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
      const ecrireL = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch { /* stockage indisponible */ } };
      const file = () => { try { return JSON.parse(lireL(CLE) || "[]"); } catch { return []; } };
      const poser = (f) => ecrireL(CLE, f.length ? JSON.stringify(f) : null);
      let enCours = false;
      return {
        actif: () => lireL(DRAPEAU) === "1",
        regler: (oui) => { ecrireL(DRAPEAU, oui ? "1" : null); if (!oui) poser([]); },
        garder: (chemin, corps) => poser([...file().filter((x) => x.chemin !== chemin), { chemin, corps, session }]),
        async vider() {
          if (enCours || !session || !file().length) return;
          enCours = true;
          let parties = 0;
          try {
            for (const x of file()) {
              if (x.session !== session) continue;               // la réponse d'une autre session ne part jamais sous celle-ci
              try { await api(x.chemin, { corps: x.corps }); parties += 1; }
              catch (e) {
                if (e.reseau) return;                            // toujours hors ligne : on réessaiera
                toast("Une réponse gardée hors ligne n'a pas pu partir : " + e.message, "erreur");
              }
              poser(file().filter((y) => y.chemin !== x.chemin));
            }
          } finally { enCours = false; }
          if (parties) { toast(parties === 1 ? "Réponse envoyée." : `${parties} réponses envoyées.`); route(true); }
        },
      };
    })();
    window.addEventListener("online", () => horsLigne.vider());

    const section = (titre, ...enfants) => h("div", { class: "bloc" }, h("span", { class: "surtitre" }, titre), ...enfants);
    const afficher = (...enfants) => $("#ecran").replaceChildren(...enfants.flat().filter(Boolean));
    const vide = (texte) => h("p", { class: "note" }, texte);
    const agir = (fn, message) => async () => { try { await fn(); if (message) toast(message); route(true); } catch (e) { toast(e.message, "erreur"); } };
    const modeIA = (ia) => ia && ia.fournisseur === "apertus" && !ia.repli ? `Préparé par Apertus · ${ia.modele || ""} — à vérifier`
      : "Formulaire : aucun modèle utilisé. Règles simples seulement (texte recopié, objet reconnu dans une courte liste) ; le reste est à compléter par vous.";

    // ------------------------------------------------------------------ accès
    function ecranAcces() {
      const code = h("input", { id: "code", inputmode: "text", autocomplete: "one-time-code", maxlength: 12, value: params.get("code") || "" });
      afficher(h("p", { class: "surtitre" }, "Club des Affaires"), h("h1", { class: "grand" }, "Activez votre compte du Club"),
        h("p", { class: "note", style: "margin-top:8px" }, "Vous êtes déjà membre : pas d'inscription. Le code figure sur l'invitation du Club."),
        h("div", { class: "champ" }, h("label", { for: "code" }, "Code d'invitation"), code),
        h("div", { class: "actions", style: "margin-top:14px" }, h("button", { class: "btn plein", onclick: async () => {
          try { const r = await api("/api/pulse/acces", { corps: { code: code.value.trim() } }); session = r.session; ecrire("pulse-session", session);
            ecrire("pulse-nom", r.nom); location.hash = "#actions"; } catch (e) { toast(e.message, "erreur"); } } }, "Continuer")),
        h("p", { class: "note", style: "margin-top:18px" }, "Démonstration : membres et entreprises fictifs."));
    }

    // ------------------------------------------------------------------ A. mes actions
    const carte = (x, extra) => h("a", { class: "carte cliquable", href: `#essai/${x.id}`, style: "display:block;text-decoration:none;color:inherit" },
      h("span", { class: "surtitre" }, x.etat), h("h3", { style: "margin-top:4px" }, x.question),
      h("p", { class: "note" }, `Porteur : ${x.porteur}`), extra ? h("p", { style: "margin-top:6px" }, extra) : null);
    async function ecranActions() {
      const a = await api("/api/pulse/moi/actions");
      afficher(h("h1", { class: "grand" }, "Mes actions"),
        section("Attend votre choix", a.a_choisir.length ? a.a_choisir.map((x) => carte(x, x.attend)) : vide("Rien n'attend votre choix.")),
        section("Mes contributions en cours", a.contributions.length ? a.contributions.map((x) => carte(x)) : vide("Aucune.")),
        section("Mes essais", a.mes_essais.length ? a.mes_essais.map((x) => carte(x)) : vide("Aucun essai en cours. Onglet « Proposer un essai » pour en préparer un.")),
        section("Résultats récents", a.recents.length ? a.recents.map((x) => carte(x, x.qualification ? `Observation : ${x.qualification}` : null)) : vide("Aucun.")));
    }

    // ------------------------------------------------------------------ B1. préparer un essai (formulation → brouillon)
    const TEMPLATES = [["temps", "Regarder l'objet quelques secondes et dire ce que vous avez compris", 10],
                       ["lieu", "Présenter l'objet dans un lieu réel (stand, vitrine)", 15],
                       ["objet", "Prêter un objet pour l'essai", 15], ["competence", "Donner un avis de professionnel", 15]];
    async function ecranNouveau() {
      const t = h("textarea", { rows: 4, id: "formulation", maxlength: 600, placeholder: "Ex. : Notre nouvelle étiquette est-elle comprise en 10 secondes à 1 mètre par quelqu'un qui ne connaît pas la marque ?" });
      const zone = h("div");
      afficher(h("h1", { class: "grand" }, "Proposer un essai"),
        h("p", { class: "note", style: "margin-top:6px" }, "Une question concrète sur un objet, un support ou un usage. D'autres membres pourront vous aider à l'essayer, à LEURS conditions."),
        h("div", { class: "champ" }, h("label", { for: "formulation" }, "Votre question, avec vos mots"), t),
        h("div", { class: "actions", style: "margin-top:8px" }, h("button", { class: "btn plein", id: "preparer", onclick: async () => {
          try { const p = await api("/api/pulse/moi/essais/preparer", { corps: { texte: t.value } }); zone.replaceChildren(formulaire(p)); }
          catch (e) { toast(e.message, "erreur"); } } }, "Préparer la proposition")), zone);
    }
    function formulaire(p) {
      const champ = (id, label, valeur, rows) => h("div", { class: "champ" }, h("label", { for: id }, label),
        rows ? h("textarea", { id, rows, maxlength: 300, value: valeur || "" }) : h("input", { id, maxlength: 300, value: valeur || "" }));
      const gestes = h("div", { id: "gestes" });
      const ajouter = (nature, geste, duree) => gestes.append(h("div", { class: "geste", "data-nature": nature },
        h("p", { class: "note" }, `Geste demandé · ${nature}`), h("input", { class: "g-texte", maxlength: 200, value: geste, "aria-label": "Geste" }),
        h("div", { class: "ligne", style: "margin-top:6px" }, h("input", { class: "g-duree", type: "number", min: 1, max: 120, value: duree, "aria-label": "Durée en minutes" }),
          h("span", { class: "note" }, "minutes"), h("button", { class: "btn discret petit", onclick: (e) => e.currentTarget.closest(".geste").remove() }, "Retirer"))));
      (p.etapes || []).forEach((e) => ajouter(e.nature, e.geste, e.duree_min));
      return h("div", { class: "carte", style: "margin-top:14px" }, h("p", { class: "ia" }, modeIA(p.ia)),
        champ("f-question", "Ce que nous essayons de savoir", p.question, 2), champ("f-objet", "L'objet, le support ou l'usage", p.objet),
        champ("f-critere", "Critère d'observation : comment lirez-vous le résultat ?", p.critere, 2),
        champ("f-pourquoi", "Pourquoi (contexte, facultatif)", p.pourquoi || "", 2),
        h("div", { class: "champ" }, h("label", { for: "f-echeance" }, "Échéance"), h("input", { id: "f-echeance", type: "date", value: p.echeance })),
        section("Gestes demandés à d'autres membres", gestes,
          h("div", { class: "ligne" }, TEMPLATES.map(([n, g, d]) => h("button", { class: "btn discret petit", style: "margin-top:8px", onclick: () => ajouter(n, g, d) }, `+ ${n}`)))),
        h("div", { class: "actions", style: "margin-top:14px" }, h("button", { class: "btn plein", id: "enregistrer", onclick: async () => {
          const corps = { question: $("#f-question").value, objet: $("#f-objet").value, critere: $("#f-critere").value, pourquoi: $("#f-pourquoi").value,
            echeance: $("#f-echeance").value, etapes: [...gestes.children].map((g) => ({ nature: g.dataset.nature, geste: g.querySelector(".g-texte").value,
              duree_min: Number(g.querySelector(".g-duree").value) })) };
          try { const e = p.id ? await api(`/api/pulse/moi/essais/${p.id}/brouillon?version=${p.version}`, { methode: "PUT", corps })
                            : await api("/api/pulse/moi/essais", { corps });
            location.hash = `#essai/${e.id}`; } catch (e) { toast(e.message, "erreur"); } } }, p.id ? "Enregistrer le brouillon corrigé" : "Enregistrer le brouillon")),
        h("p", { class: "note", style: "margin-top:8px" }, "Rien n'est envoyé à personne tant que vous n'avez pas publié la proposition."));
    }

    // ------------------------------------------------------------------ B0. agir à plusieurs : besoin → exigences confirmées → proposition
    const ROLES = { voix: "Voix (langue)", lieu: "Lieu", public: "Public", autre: "Autre contribution" };
    async function ecranAction() {
      const t = h("textarea", { rows: 3, id: "besoin", maxlength: 600, placeholder: "Ex. : Je voudrais présenter nos tisanes à des acheteurs germanophones pendant la Foire, jeudi après-midi." });
      const zone = h("div");
      afficher(h("h1", { class: "grand" }, "Agir à plusieurs"),
        h("p", { class: "note", style: "margin-top:6px" }, "Ce que vous ne pouvez pas faire seul·e. Dites-le avec vos mots : Club Pulse propose ce qu'il faudrait réunir ; vous confirmez ; le serveur cherche des offres RÉELLES et le moment où elles se recouvrent."),
        h("div", { class: "champ" }, h("label", { for: "besoin" }, "Votre besoin"), t),
        h("div", { class: "actions", style: "margin-top:8px" }, h("button", { class: "btn plein", id: "comprendre", onclick: async (ev) => {
          const bouton = ev.currentTarget;
          bouton.disabled = true;
          try { const p = await api("/api/pulse/moi/actions/preparer", { corps: { texte: t.value } }); zone.replaceChildren(formAction(p)); }
          catch (e) { toast(e.message, "erreur"); } finally { bouton.disabled = false; } } }, "Comprendre ma demande")), zone);
    }
    function formAction(p) {
      const liste = h("div", { id: "exigences" });
      const ajouter = (x) => liste.append(h("div", { class: "exigence", "data-role": x.role, "data-nature": x.nature, "data-concept": x.concept || "" },
        h("div", { class: "ligne" }, h("b", {}, ROLES[x.role] || x.role), h("button", { class: "btn discret petit", style: "margin-left:auto", onclick: (e) => e.currentTarget.closest(".exigence").remove() }, "Retirer")),
        h("input", { class: "x-geste", maxlength: 200, value: x.geste, "aria-label": "Ce que la personne ferait" }),
        h("div", { class: "ligne", style: "margin-top:6px" }, h("input", { class: "x-duree", type: "number", min: 5, max: 120, value: x.duree_min, "aria-label": "Durée en minutes" }), h("span", { class: "note" }, "min"),
          h("input", { class: "x-livrable", maxlength: 120, value: x.livrable || "", placeholder: "à remettre (facultatif)", "aria-label": "Résultat à remettre" }))));
      p.exigences.forEach(ajouter);
      const f = p.fenetre || {};
      const jour = h("input", { id: "f-jour", type: "date", value: f.jour || "" });
      const debut = h("input", { id: "f-debut", type: "time", step: 900, value: f.debut || "" });
      const fin = h("input", { id: "f-fin", type: "time", step: 900, value: f.fin || "" });
      const minimum = h("input", { id: "f-min", type: "number", min: 5, max: 240, value: 30 });
      const question = h("input", { id: "f-question", maxlength: 300, value: p.objet ? `Présenter nos ${p.objet}${p.langue_public === "de" ? " à des acheteurs germanophones" : ""}` : p.texte });
      const critere = h("textarea", { id: "f-critere", rows: 2, maxlength: 300, placeholder: "Qu'est-ce qui comptera comme réalisé ?" });

    function reduire(fichier) {

        const lecteur = new FileReader(), img = new Image();
        img.onload = () => { const k = Math.min(1, 1024 / Math.max(img.width, img.height)); const cv = document.createElement("canvas");
          cv.width = Math.max(1, Math.round(img.width * k)); cv.height = Math.max(1, Math.round(img.height * k));
          cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); ok(cv.toDataURL("image/jpeg", 0.8)); };
        img.onerror = () => ko(new Error("image illisible"));
        lecteur.onload = () => { img.src = lecteur.result; }; lecteur.onerror = () => ko(new Error("image illisible"));
        lecteur.readAsDataURL(fichier);
      });

      let declaree = null;
      const lireJson = async (c) => { const r = await fetch(c, { headers: session ? { "X-Pulse-Session": session } : {} }); return r.ok ? r.json() : {}; };
      try { if (session && (await lireJson("/api/pulse/moi/foire")).actif) { const x = await lireJson("/api/pulse/moi/distance"); declaree = x.profil && x.profil.langue; } }
      catch (e) { /* sans session ou interrupteur éteint : la langue de l'adresse seulement */ }
      let lg = langueVoulue(declaree);
      if (lg === "en" && !(await lireJson("/api/pulse/langues")).en) lg = "fr";   // l'anglais suit son interrupteur (lot 8)
      if (lg !== "fr") activerAllemand(lg);                // allemand ou anglais, à relire par un natif
    })();
    window.addEventListener("online", () => toast("De retour en ligne."));
    window.addEventListener("offline", () => toast("Hors ligne : les actions attendront le réseau.", "erreur"));
    if (params.get("code") && !session) location.hash = "#acces";
    // QR JURÉ : le passe est échangé UNE fois contre une session courte, puis retiré de l'adresse (historique, captures)
    const passe = params.get("jure");
    if (passe) {
      params.delete("jure");
      history.replaceState(null, "", location.pathname + (params.toString() ? "?" + params : "") + "#demandes");
      try {
        const r = await fetch("/api/pulse/jure", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ jeton: passe }) });
        const j = await r.json();
        if (!r.ok) throw new Error(j.detail || `serveur : ${r.status}`);
        session = j.session; ecrire("pulse-session", session);
        ecrire("pulse-jure", `${j.nom}|${j.jusqu_a}`);
      } catch (e) { session = null; ecrire("pulse-session", null); toast(e.message, "erreur"); location.hash = "#acces"; }
    }
    const jure = lire("pulse-jure");
    if (jure && session) {
      const [nom, jusqua] = jure.split("|");
      const heure = new Date(Number(jusqua) * 1000).toLocaleTimeString("fr-CH", { hour: "2-digit", minute: "2-digit" });
      $("#bandeau-jure").textContent = `Jury : vous jouez ${nom}, personnage FICTIF, jusqu'à ${heure}. Votre passe est journalisé : ce que vous faites est attribué au jury.`;
      $("#bandeau-jure").hidden = false;
    }
    route();
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/app/sw.js", { scope: "/app" }).catch(() => {});
  </script>
</body>
</html>
