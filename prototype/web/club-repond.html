<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le Club répond</title>
  <meta name="description" content="Une demande débloquée de bout en bout sur un réseau fictif : plan de contributions, consentement, effet confirmé par le demandeur, mémoire vérifiée — puis le jury essaie sa propre demande.">
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    body { background: var(--papier); }
    .scene { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 24px; padding: 20px 24px 96px; max-width: 1500px; margin: 0 auto; }
    .carte-etape, .jury { background: var(--surface); border: 1.5px solid var(--ligne); border-radius: var(--rayon); padding: 22px 24px; }
    .carte-etape { min-height: 60vh; }
    .jury { position: sticky; top: 12px; align-self: start; }
    .acte { display: inline-flex; gap: 8px; align-items: center; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin: 0; }
    .acte b { background: var(--rouge); color: #fff; border-radius: 6px; padding: 2px 8px; }
    h1 { font-size: clamp(26px, 3vw, 40px); margin: 6px 0 8px; line-height: 1.1; }
    h1.debloquee { color: var(--vert); }
    .dit { font-size: 19px; color: var(--encre-2); margin: 0 0 16px; }
    .bloc { border-top: 1.5px solid var(--ligne); padding-top: 12px; margin-top: 14px; }
    .bloc h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--encre-2); margin: 0 0 6px; }
    .bloc p, .bloc li { font-size: 15px; margin: 4px 0; }
    .bloc ul { margin: 0; padding-left: 18px; }
    q { font-style: italic; }
    .puce { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; background: var(--ambre-pale); color: var(--ambre); white-space: nowrap; }
    .puce.ok { background: var(--vert-pale); color: var(--vert); }
    .puce.non { background: var(--rouge-pale); color: var(--rouge-fonce); }
    .puce.joue { background: var(--ligne); color: var(--encre-2); }
    .etapes { display: grid; gap: 10px; }
    .etp { border: 2px solid var(--ligne); border-radius: var(--rayon); padding: 10px 14px; }
    .etp + .etp { margin-top: 10px; }
    .etp.ok { border-color: var(--vert); } .etp.manque { border-color: var(--ambre); border-style: dashed; }
    .etp h3 { margin: 0 0 4px; font-size: 18px; }
    .etp p { margin: 3px 0; font-size: 15px; }
    .tuiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
    .tuile { border: 1.5px solid var(--ligne); border-radius: var(--rayon); padding: 10px 12px; }
    .tuile .lib { font-size: 12px; color: var(--encre-2); }
    .tuile .val { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .col { border: 1.5px solid var(--ligne); border-radius: var(--rayon); padding: 10px 12px; }
    .col h3 { margin: 0 0 6px; font-size: 15px; }
    .col p, .col li { font-size: 14px; margin: 3px 0; }
    .abst { border-left: 4px solid var(--ambre); padding: 8px 12px; background: var(--ambre-pale); border-radius: 0 var(--rayon) var(--rayon) 0; }
    .memo { border-left: 4px solid var(--vert); padding: 8px 12px; background: var(--vert-pale); border-radius: 0 var(--rayon) var(--rayon) 0; }
    .joues { font-size: 12px; color: var(--encre-2); margin: 10px 0 0; }
    .note { font-size: 12px; color: var(--encre-3); }
    .jury h2 { margin: 0 0 4px; font-size: 20px; }
    .jury textarea { width: 100%; min-height: 96px; font: inherit; font-size: 16px !important; padding: 10px; border: 1.5px solid var(--ligne); border-radius: var(--rayon); background: var(--papier); color: var(--encre); box-sizing: border-box; }
    .essais { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .essais button { font-size: 13px; }
    #verdict { margin-top: 10px; }
    .commandes { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1.5px solid var(--ligne);
      display: flex; align-items: center; gap: 10px; padding: 10px 24px; z-index: 5; flex-wrap: wrap; }
    .progres { display: flex; gap: 5px; flex: 1; min-width: 160px; }
    .progres i { height: 6px; flex: 1; background: var(--ligne); border-radius: 3px; }
    .progres i.fait { background: var(--rouge); }
    .horloge { font-size: 13px; color: var(--encre-2); font-variant-numeric: tabular-nums; }
    @media (max-width: 900px) {
      .scene { grid-template-columns: 1fr; padding: 12px 16px 120px; }
      .jury { position: static; }
      .deux { grid-template-columns: 1fr; }
      .tuiles { grid-template-columns: 1fr 1fr; }
      .commandes { padding: 8px 16px; gap: 6px; }
      .commandes .btn { width: auto; flex: 1 1 0; padding: 8px 6px; font-size: 14px; }
      .horloge { width: 100%; font-size: 12px; }
    }
    @media print { .commandes, .jury { display: none; } .scene { display: block; } }
  </style>
</head>
<body>
  <a class="skip" href="#principal">Aller au contenu</a>
  <main id="principal" class="scene">
    <section class="carte-etape" id="carte" aria-live="polite"></section>
    <aside class="jury" aria-labelledby="jury-titre">
      <h2 id="jury-titre">À vous : écrivez une demande</h2>
      <p class="note">Calcul en direct sur le même réseau fictif. Rien n'est écrit, personne n'est sollicité.</p>
      <label for="texte" class="note">Votre demande</label>
      <textarea id="texte" maxlength="600" placeholder="Ex. : Je cherche quelqu'un pour traduire notre site en allemand."></textarea>
      <div class="essais" aria-label="Exemples">
        <button class="btn petit" type="button" data-t="J'ai besoin d'aide pour la distribution de nos produits.">ambiguë</button>
        <button class="btn petit" type="button" data-t="Je cherche un emballage en allemand pour nos coffrets.">contrainte</button>
        <button class="btn petit" type="button" data-t="Je cherche un distributeur au Japon pour nos tisanes.">hors du Club</button>
        <button class="btn petit" type="button" data-t="Je cherche une traductrice pour nos étiquettes.">simple</button>
      </div>
      <button class="btn primaire" type="button" id="essayer">Que ferait le Club ?</button>
      <div id="verdict" aria-live="polite"></div>
    </aside>
  </main>
  <nav class="commandes" aria-label="Commandes de la démonstration">
    <button class="btn petit" type="button" id="reinit" title="Réinitialiser (R)">⟲ Réinitialiser</button>
    <button class="btn petit" type="button" id="prec" title="Étape précédente (←)">← Précédent</button>
    <button class="btn primaire" type="button" id="suiv" title="Étape suivante (→ ou espace)">Suivant →</button>
    <div class="progres" id="progres" aria-hidden="true"></div>
    <span class="horloge" id="horloge"></span>
  </nav>
  <div id="toasts" aria-live="polite"></div>
  <script type="module">
    import { $, api, h, toast } from "/static/js/outils.js";
    let vue = null, occupe = false;
    const CHAPITRES = ["Demande", "Plan", "Vues privées", "Contributions", "Débloquée", "Mémoire", "Manque", "Bilan"];
    const trace = (n) => vue.traces.find((t) => t.etape === n);
    const bloc = (titre, ...enfants) => h("div", { class: "bloc" }, h("h2", {}, titre), ...enfants);
    const puce = (txt, cls = "") => h("span", { class: `puce ${cls}` }, txt);
    const tuile = (lib, val) => h("div", { class: "tuile" }, h("div", { class: "lib" }, lib), h("div", { class: "val" }, String(val)));
    const cite = (x) => x ? [" ← ", h("q", {}, x)] : "";
    const STATUT = { DEBLOQUEE: ["débloquée", "ok"], PARTIELLE: ["partiellement", ""], NON_DEBLOQUEE: ["non débloquée", "non"],
      CONTRIBUTION_RECUE: ["contribution reçue", ""], EN_ATTENTE: ["en attente", ""] };
    const ETATS = { DEBLOQUEE: "DÉBLOQUÉE", PARTIELLEMENT_DEBLOQUEE: "partiellement débloquée", EN_COURS: "en cours", OUVERTE: "ouverte" };

    function manque(m) {
      if (!m) return null;
      return h("div", { class: "abst" }, h("p", {}, m.raison, "."),
        m.levees.length ? h("p", {}, "Plus petite modification qui débloque : ", m.levees.map((l) => `sans « ${l.sans} » → ${l.personnes} personne(s)`).join(" ; "), ".") : null);
    }
    function etape(l) {
      return h("div", { class: `etp ${l.qui ? "ok" : "manque"}` }, h("h3", {}, l.etape, h("span", { class: "note" }, cite(l.extrait))),
        l.qui ? [h("p", {}, h("strong", {}, l.qui), " ", puce(l.niveau === "forte" ? "preuve forte" : "partielle · à vérifier", l.niveau === "forte" ? "ok" : "")),
          h("p", {}, "Preuve : ", h("q", {}, l.preuve)), l.reserve ? h("p", { class: "note" }, `Réserve silencieuse : ${l.reserve} (contactée seulement si besoin)`) : null]
          : manque(l.manque));
    }
    const ecartees = (liste) => (liste || []).length ? h("p", { class: "note" }, liste.map((e) => e.raison).join(" ; "), ".") : null;

    const RENDUS = {
      0: (f) => [bloc("Ce que le Club a compris", h("div", { class: "etapes" }, f.etapes.map((e, i) => h("div", { class: "etp" }, h("h3", {}, `Étape ${i + 1} · ${e.etape}`, h("span", { class: "note" }, cite(e.extrait))))))),
        bloc("Contraintes, pour toutes les étapes", h("ul", {}, f.contraintes.map((c) => h("li", {}, c)))),
        bloc("Débloquée quand…", h("p", {}, f.effet_attendu, " — c'est Sophie qui le dira.")),
        h("p", { class: "note" }, f.question ? "" : "Aucune question : aucune réponse ne changerait le plan. ", f.analyse, ".")],
      1: (f) => [h("div", { class: "etapes" }, f.plan.map(etape)),
        h("div", { class: "tuiles" }, tuile("personnes sollicitées", f.sollicitees), tuile("membres non dérangés", f.non_derangees), tuile("étapes couvertes", f.couverture)),
        h("p", { class: "note" }, f.coulisses, ".")],
      2: (f) => [h("div", { class: "deux" },
          h("div", { class: "col" }, h("h3", {}, "Ce que voit Anna"), h("p", {}, h("strong", {}, "Qui demande : "), f.vue_anna.qui_demande),
            h("p", {}, h("strong", {}, "Votre part : "), f.vue_anna.vos_etapes.map((e) => e.libelle).join(", ")),
            h("p", {}, h("strong", {}, "Débloqué quand : "), f.vue_anna.prochaine_etape), h("p", {}, puce("vous pouvez refuser", "ok"))),
          h("div", { class: "col" }, h("h3", {}, "Ce que voit Sophie"), h("ul", {}, f.vue_sophie.etapes.map((e) => h("li", {}, `${e.etape} : `, e.a_accepte.length ? e.a_accepte.join(", ") : "une personne sollicitée, en attente"))))),
        h("p", { class: "note" }, f.invisible, ". Un refus ne sera jamais montré à Sophie.")],
      3: (f) => [...f.contributions.map((c) => h("div", { class: "etp" }, h("h3", {}, `${c.qui} · ${c.nature}`), h("p", {}, h("strong", {}, c.titre)),
          c.texte ? h("p", {}, c.texte) : null, h("p", { class: "note" }, "Réutilisation : ", c.reutilisation),
          c.telecharger ? h("p", {}, h("a", { class: "btn petit", href: c.telecharger, download: "" }, "Télécharger la fiche")) : null)),
        h("p", {}, "État : ", h("strong", {}, ETATS[f.etat] || f.etat), " — ", f.pourquoi, ".")],
      4: (f) => [h("div", { class: "etapes" }, f.etat.etapes.map((e) => h("div", { class: `etp ${e.statut === "DEBLOQUEE" ? "ok" : ""}` }, h("h3", {}, e.libelle, " ", puce(...(STATUT[e.statut] || [e.statut])))))),
        bloc("Entre dans la mémoire vérifiée du Club", h("ul", {}, f.memoire.map((m) => h("li", {}, m.titre, m.auteur ? ` — ${m.auteur}` : "", ` (${m.confirmations} confirmation)`)))),
        h("p", { class: "note" }, f.regle, ". L'introduction de Markus reste privée : elle n'entre pas en mémoire.")],
      5: (f) => [...f.depuis_la_memoire.map((m) => h("div", { class: "memo" }, h("p", {}, h("strong", {}, "Réponse immédiate : "), m.titre, m.auteur ? ` — ${m.auteur}` : ""),
          h("p", {}, "Effet déjà confirmé : ", m.confirmations.map((c) => puce(STATUT[c === "debloque" ? "DEBLOQUEE" : "PARTIELLE"][0], "ok"))),
          m.differences.map((d) => h("p", {}, puce("à vérifier"), " ", d)), h("p", {}, h("a", { class: "btn petit", href: m.telecharger, download: "" }, "Télécharger")))),
        h("div", { class: "tuiles" }, tuile("personnes dérangées", f.personnes_derangees), tuile("réponses vérifiées", f.depuis_la_memoire.length)),
        ecartees(f.ecartees), h("p", { class: "note" }, "Jamais montré : ", f.jamais_montre, ".")],
      6: (f) => [h("div", { class: "etapes" }, f.japon.map(etape)),
        bloc(`Et si une contrainte bloque ? « ${f.levee.demande} »`, h("div", { class: "etapes" }, f.levee.etapes.map(etape))),
        bloc("Pour l'animatrice", h("p", {}, f.pour_l_animatrice, "."))],
      7: (f) => [h("div", { class: "deux" }, h("div", { class: "col" }, h("h3", {}, "Calculé en direct"), h("ul", {}, f.calcule.map((x) => h("li", {}, x)))),
          h("div", { class: "col" }, h("h3", {}, "Joué"), h("ul", {}, f.joue.map((x) => h("li", {}, x))))),
        h("p", { class: "note" }, `${f.fictif}. Journal : ${f.journal} événements, empreinte ${f.empreinte}.`)],
    };

    function carte() {
      const e = vue.etape - 1;
      $("#horloge").textContent = `Date simulée : ${vue.le} · étape ${vue.etape}/${vue.total}`;
      $("#progres").replaceChildren(...Array.from({ length: vue.total }, (_, i) => h("i", { class: i < vue.etape ? "fait" : "", title: CHAPITRES[i] })));
      $("#prec").disabled = vue.etape === 0; $("#suiv").disabled = vue.etape >= vue.total;
      if (e < 0) {
        $("#carte").replaceChildren(h("p", { class: "acte" }, "Le Club répond · démonstration"),
          h("h1", {}, "Nous ne cherchons plus des contacts. Nous débloquons des demandes."),
          h("p", { class: "dit" }, "Une demande, un plan, des contributions consenties, un effet confirmé par la personne aidée — et un Club qui s'en souvient."),
          h("p", { class: "note" }, vue.avertissement));
        return;
      }
      const t = trace(e);
      $("#carte").replaceChildren(h("p", { class: "acte" }, h("b", {}, String(e + 1)), CHAPITRES[e], ` · ${t.le}`),
        h("h1", { class: e === 4 ? "debloquee" : "" }, t.titre), h("p", { class: "dit" }, t.dit),
        ...(RENDUS[e]?.(t.faits) || []).filter(Boolean),
        ...(t.joue.length ? [h("p", { class: "joues" }, puce("joué", "joue"), " ", t.joue.join(" · "), " — geste humain joué par la présentation.")] : []));
    }

    const VERDICTS = { PLAN: "Le Club peut aider", PLAN_PARTIEL: "Le Club peut aider en partie", MANQUE: "Le Club ne peut pas aider (et le dit)",
      QUESTION: "Une seule question d'abord", PRECISER: "Précisez votre demande" };
    function rendreVerdict(r) {
      $("#verdict").replaceChildren(...[h("h3", {}, VERDICTS[r.verdict] || r.verdict),
        r.question ? h("div", { class: "abst" }, h("p", {}, `« ${r.question.terme} » : que voulez-vous dire ?`),
          h("ul", {}, r.question.options.map((o) => h("li", {}, `${o.libelle} → ${o.personnes} personne(s)`))), h("p", { class: "note" }, r.question.pourquoi, ".")) : null,
        r.sens_non_couverts.length ? h("div", { class: "abst" }, h("p", {}, `Aucun des sens de « ${r.sens_non_couverts.join(", ")} » n'est couvert par un membre : c'est un manque du Club, pas une question à vous poser.`)) : null,
        r.memoire.length ? h("div", { class: "memo" }, h("p", {}, "Déjà dans la mémoire vérifiée : ", r.memoire.map((m) => m.titre).join(" ; "))) : null,
        h("div", { class: "etapes" }, r.etapes.map(etape)), ecartees(r.ecartees),
        r.contraintes.length ? h("p", { class: "note" }, "Contraintes : ", r.contraintes.join(" · ")) : null,
        r.etapes.length ? h("p", { class: "note" }, `${r.sollicitees} personne(s) sollicitée(s), ${r.non_derangees} non dérangée(s).`) : null,
        r.incertain.length ? h("p", { class: "note" }, r.incertain.join(" ")) : null].filter(Boolean));
    }
    async function essayer() {
      const texte = $("#texte").value.trim();
      if (texte.length < 3) { toast("Écrivez une demande d'au moins quelques mots.", "erreur"); return; }
      try { rendreVerdict(await api("/api/club-repond/essayer", { corps: { texte } })); }
      catch (err) { toast(err.message, "erreur"); }
    }
    $("#essayer").addEventListener("click", essayer);
    document.querySelectorAll(".essais button").forEach((b) => b.addEventListener("click", () => { $("#texte").value = b.dataset.t; essayer(); }));

    async function appel(chemin) {
      if (occupe) return;
      occupe = true;
      try { vue = await api(chemin, { methode: "POST" }); carte(); }
      catch (e) { toast(e.message, "erreur"); }
      finally { occupe = false; }
    }
    $("#suiv").addEventListener("click", () => appel("/api/club-repond/suivant"));
    $("#prec").addEventListener("click", () => appel(`/api/club-repond/aller/${Math.max(0, vue.etape - 1)}`));
    $("#reinit").addEventListener("click", () => appel("/api/club-repond/reinitialiser"));
    document.addEventListener("keydown", (ev) => {
      if (ev.target.closest("input, textarea, select, button")) return;
      if (ev.key === "ArrowRight" || ev.key === " ") { ev.preventDefault(); if (vue.etape < vue.total) appel("/api/club-repond/suivant"); }
      if (ev.key === "ArrowLeft" && vue.etape > 0) appel(`/api/club-repond/aller/${vue.etape - 1}`);
      if (ev.key === "r" || ev.key === "R") appel("/api/club-repond/reinitialiser");
    });
    api("/api/club-repond").then((v) => { vue = v; carte(); }).catch((e) => toast(e.message, "erreur"));
  </script>
</body>
</html>
