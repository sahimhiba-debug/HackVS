# Taxonomie des MÉTIERS (Foire 2026) — une vingtaine de métiers, FR / DE.
# Sert : la déclaration d'un invité (passe découverte), les métiers présents/absents (« le Club cherche »), la
# classification des phrases Tally (scripts/ingest_tally.py). Les rôles des patrons de capacités y figurent (role: …).
# Format volontairement simple (lu par intelligence/metiers.py sans dépendance) : une entrée par « - id: ».
