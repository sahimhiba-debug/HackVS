# Taxonomie des MÉTIERS (Foire 2026) — 25 métiers, libellés FR / DE (4 ajoutés le 3 octobre d'après la liste du Club :
# conseil, commerce, collectivité, tourisme).
# Sert : la déclaration d'un invité (passe découverte), « le Club cherche » (métiers présents / absents), Suivi (métiers
# manquants), la classification des phrases Tally (scripts/eval_classification.py). `role:` relie un métier au rôle d'une
# pièce des patrons de capacités (« public » — des acheteurs, un auditoire — n'est pas un métier : « autre »).
# Format volontairement simple, lu sans dépendance par intelligence/metiers.py : une entrée par « - id: ».
